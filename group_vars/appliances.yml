---
# Appliance API credentials (OPNsense, UniFi) used for AUTOMATION, not
# interactive logins - kept separate from the christian WebUI identity
# accounts, which now live in group_vars/all.yml (webui_identity now runs
# once from localhost across every service, not just this group, so its
# vars belong at the all.yml level - see that file).
webui_identity_automation_accounts:
  - service: opnsense
    username: automation
    role: readonly
    api_base_url: "https://10.20.0.1"
    api_key: "{{ lookup('community.general.bitwarden', 'homelab-opnsense-api', field='notes') }}"
  - service: unifi
    username: automation
    role: readonly
    api_base_url: "https://10.20.0.107"
    api_password: "{{ lookup('community.general.bitwarden', 'homelab-unifi-api', field='password') }}"

# network_appliances placeholder (scaffolded, not implemented — see
# roles/network_appliances/README.md). Reuses the webui_identity
# credentials above once that role is implemented.
# network_appliances_enabled: false
