[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Needed for become_user to an unprivileged non-connecting account (e.g.
# shell_config's `become_user: christian`/`hermes` from the hermes ssh
# user) - without this, Ansible tries POSIX ACLs (`chmod A+user:...`) to
# share its tmp dir with the target user, which fails on this filesystem.
# Internal homelab network only - the tradeoff (briefly world-readable
# module tmpfiles) is acceptable here.
allow_world_readable_tmpfiles = True

[inventory]
enable_plugins = yaml, ini, auto
