---
# Home Assistant (HAOS VM 101) via its API only - no SSH, nothing runs on the VM.
#   (default)       read-only drift/health/backup-freshness report
#   --tags alerting install the daily report cron + Alertmanager push
#   --tags update   backup, then update homeassistant_update_addons one by one
#   --tags core     backup, then update HA Core (snapshot VM101 first!)
#   --tags os       backup, then update HAOS (reboots the VM; snapshot first!)
#   --tags backup   create a full HA backup now (run before any update)
# Never use a Supervisor/OS update from here without a fresh backup.
- name: Home Assistant
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.import_role: {name: homeassistant}
      tags: [report]
    - ansible.builtin.include_role: {name: homeassistant, tasks_from: backup.yml, apply: {tags: [backup]}}
      tags: [never, backup]
    - ansible.builtin.include_role: {name: homeassistant, tasks_from: alerting.yml, apply: {tags: [alerting]}}
      tags: [never, alerting]
    - ansible.builtin.include_role: {name: homeassistant, tasks_from: update.yml, apply: {tags: [update]}}
      tags: [never, update]
    - ansible.builtin.include_role: {name: homeassistant, tasks_from: update_platform.yml, apply: {tags: [core]}}
      vars: {homeassistant_platform: core}
      tags: [never, core]
    - ansible.builtin.include_role: {name: homeassistant, tasks_from: update_platform.yml, apply: {tags: [os]}}
      vars: {homeassistant_platform: os}
      tags: [never, os]
