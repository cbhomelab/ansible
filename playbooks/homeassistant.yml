---
# Home Assistant (HAOS VM 101) via its API only - no SSH, nothing runs on the VM.
#   (default)       read-only drift/health/backup-freshness report
#   --tags backup   create a full HA backup now (run before any update)
# Never use a Supervisor/OS update from here without a fresh backup.
- name: Home Assistant
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.import_role: {name: homeassistant}
      tags: [report]
    - ansible.builtin.include_role: {name: homeassistant, tasks_from: backup.yml, apply: {tags: [backup]}}
      tags: [never, backup]
