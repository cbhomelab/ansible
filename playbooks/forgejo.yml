---
# Forgejo git server on lxc110. Create the guest first (playbooks/proxmox-guests.yml).
- name: Forgejo
  hosts: lxc110-forgejo
  become: true
  roles:
    # Users/keys/sudoers first: new guests otherwise only get them on the next
    # access.yml run, which broke shell.yml on this host.
    - access_control
    - forgejo
