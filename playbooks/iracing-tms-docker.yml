---
# iRacing Team Manager on saturn (compose stacks, macvlan IPs outside the DHCP pool). Replaces playbooks/iracing-tms.yml.
- name: iRacing Team Manager (prod)
  hosts: saturn
  become: true
  vars: {itd_name: iracing-tms-prod, itd_ip: 10.20.0.162, itd_ref: main, itd_dev_mode: false, itd_env_overrides: {DISCORD_BOT_ENABLED: "true"}}
  roles: [iracing_tms_docker]

- name: iRacing Team Manager (dev)
  hosts: saturn
  become: true
  vars: {itd_name: iracing-tms-dev, itd_ip: 10.20.0.163, itd_ref: dev, itd_dev_mode: true, itd_mumble: true, itd_mumble_ip: 10.20.0.165, itd_internal_subnet: 172.19.0.0/16, itd_mumble_internal_ip: 172.19.0.250, itd_backup_keep: 3, itd_dev_uid: 1008, itd_env_overrides: {DISCORD_BOT_ENABLED: "true", APP_ENV: development, DEBUG: "true", LOG_LEVEL: DEBUG, SCRAPER_REQUEST_DELAY: "2", SCHEDULER_SYNC_EVENTS: "true"}}
  roles: [iracing_tms_docker]
