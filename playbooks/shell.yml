---
# Shell config rollout: cbhomelab/dotfiles via chezmoi, for christian +
# hermes (Linux) and christian only (Windows). See roles/shell_config/README.md.
#
# Linux host scope mirrors playbooks/access.yml (same hosts that get OS
# user accounts in the first place) - proxmox_host, lxc_guests, vm_guests,
# omv, lxc107-unifi, minus vm101-homeassistant (HAOS, no real shell) and
# lxc103-hermesagent (control node itself, excluded from self-modification
# per that playbook's precedent).

- name: "Apply shell config - Linux (christian + hermes)"
  hosts: proxmox_host:lxc_guests:vm_guests:omv:lxc107-unifi:!vm101-homeassistant:!lxc103-hermesagent
  # shell_config needs the christian/hermes OS accounts to exist. A guest added
  # after the last access.yml run (e.g. lxc110-forgejo) had neither, so the play
  # failed with "sudo: unknown user christian". Converge access_control first
  # (same host scope as access.yml, idempotent) so new guests self-heal.
  pre_tasks:
    - name: Ensure OS accounts exist before applying shell config
      ansible.builtin.include_role:
        name: access_control
        apply:
          become: true
      tags: [always]
  roles:
    - shell_config

- name: "Apply shell config - Windows (christian only)"
  hosts: windows
  gather_facts: false
  roles:
    - shell_config

# OPNsense is API-managed (connection: local in the inventory), so build a
# throwaway SSH host for it here instead of changing its inventory entry.
- name: "Register OPNsense over SSH (christian)"
  hosts: localhost
  gather_facts: false
  tags: [opnsense]
  tasks:
    - name: Add opnsense-shell
      ansible.builtin.add_host:
        name: opnsense-shell
        groups: [freebsd]
        ansible_host: "{{ hostvars['vm100-opnsense'].ansible_host }}"
        ansible_connection: ssh
        ansible_user: christian
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        ansible_shell_type: sh

- name: "Apply shell config - OPNsense (christian, Starship only)"
  hosts: freebsd
  gather_facts: false
  tags: [opnsense]
  roles:
    - shell_config
