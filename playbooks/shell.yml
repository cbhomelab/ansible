---
# Shell config rollout: cbhomelab/dotfiles via chezmoi, for christian +
# hermes (Linux) and christian only (Windows). See roles/shell_config/README.md.
#
# Linux host scope mirrors playbooks/access.yml (same hosts that get OS
# user accounts in the first place) - proxmox_host, lxc_guests, vm_guests,
# omv, lxc107-unifi, minus vm101-homeassistant (HAOS, no real shell) and
# lxc103-hermesagent (control node itself, excluded from self-modification
# per that playbook's precedent).

- name: "Apply shell config - Linux (christian + hermes)"
  hosts: proxmox_host:lxc_guests:vm_guests:omv:lxc107-unifi:!vm101-homeassistant:!lxc103-hermesagent
  roles:
    - shell_config

- name: "Apply shell config - Windows (christian only)"
  hosts: windows
  gather_facts: false
  roles:
    - shell_config
