---
# system_baseline: opt-in per host (system_baseline_enabled in inventory).
# Deliberately excludes proxmox_host (neptune), vm_guests (HAOS) and the
# OPNsense appliance. lxc107-unifi lives in `appliances` but is a normal
# Debian LXC, so it is listed explicitly.
- name: Apply system baseline
  hosts: lxc_guests:debian_vms:omv:lxc107-unifi
  become: true
  roles:
    - system_baseline
