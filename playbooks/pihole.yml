---
# Build/converge Pi-hole v6 on lxc108 (default). Use --check first.
#   --tags update   in-place update with backup + health check
# App state (gravity DB customisations, query history) is restored by app_state.
- name: Pi-hole
  hosts: lxc108-pihole,lxc120-pihole2
  become: true
  tasks:
    - ansible.builtin.import_role: {name: pihole}
      tags: [build]
    - ansible.builtin.include_role: {name: pihole, tasks_from: update.yml, apply: {tags: [update]}}
      tags: [never, update]
