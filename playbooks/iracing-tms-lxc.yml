---
# iRacing Team Manager, native LXC install (replaces the Docker dev stack on saturn once cut over).
#   set -a; . ~/.config/proxmox/jupiter.env; . ~/.config/opnsense/env; set +a; export BW_SESSION=$(cat ~/.config/bitwarden/session)
#   ansible-playbook playbooks/proxmox-guests-jupiter.yml   # creates the LXC
#   ansible-playbook playbooks/access.yml --limit lxc130-iracing-dev -e ansible_user=root   # first time only
#   ansible-playbook playbooks/iracing-tms-lxc.yml
- name: iRacing Team Manager (dev, native LXC on jupiter)
  hosts: lxc130-iracing-dev
  become: true
  vars:
    itl_env_overrides:
      DISCORD_BOT_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      SCHEDULER_SYNC_EVENTS: "true"
      SCRAPER_REQUEST_DELAY: "2"
  roles: [iracing_tms_lxc]

- name: iRacing Team Manager (production, native LXC on jupiter)
  hosts: lxc106-iracing-prod
  become: true
  vars:
    itl_branch: main
    itl_installer_ref: dev          # installer is branch-independent; main has no native-LXC installer yet
    itl_app_env: production
    itl_vault_prefix: itms-prod
    itl_public_url: https://teams.fast-racing.org
    itl_env_overrides:
      DISCORD_BOT_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      DISCORD_OAUTH_REDIRECT_URI: https://teams.fast-racing.org/auth/discord/callback
  roles: [iracing_tms_lxc]
