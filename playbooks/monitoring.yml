---
# Promtail file-log shipping on LXC guests only. Deliberately excludes:
#   proxmox_host (neptune) - hands-off by user decision
#   omv (saturn)           - already runs a Promtail container w/ docker_sd
#   vm101-homeassistant    - HAOS, no shell
#   lxc103-hermesagent     - handle with care; nothing to ship
#   appliances             - native syslog forwarding
# Hosts with an empty monitoring_agents_promtail_jobs are no-ops (lxc104).
# SSH keys come from group_vars/host_vars (lxc_guests and lxc107-unifi both
# use the proxmox-boundary hermes key).

- name: Apply monitoring agents (Promtail applogs + node_exporter)
  hosts: lxc_guests:lxc107-unifi:omv:!lxc103-hermesagent
  become: true
  vars:
    ansible_user: hermes
  roles:
    - monitoring_agents
