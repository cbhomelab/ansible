---
# compose_stacks: operate the OMV-managed compose projects on saturn via the
# docker compose CLI (Option B, see README). Default is READ-ONLY audit.
compose_stacks_enabled: false
compose_stacks_base_dir: /opt/docker-compose
compose_stacks_global_env: "{{ compose_stacks_base_dir }}/global.env"
# Actions are opt-in and per project. Nothing is pulled/recreated unless listed:
#   compose_stacks_projects:
#     - {name: 20-radarr, state: started, pull: true}   # state: started | stopped
compose_stacks_projects: []
# Never touched by apply even if listed (networks/DNS others depend on).
compose_stacks_protected: [00-networks, 00-ddns]
