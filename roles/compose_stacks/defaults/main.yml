---
# compose_stacks: operate the OMV-managed compose projects on saturn via the
# docker compose CLI (Option B, see README). Default is READ-ONLY audit.
compose_stacks_enabled: false
compose_stacks_base_dir: /opt/docker-compose
compose_stacks_global_env: "{{ compose_stacks_base_dir }}/global.env"
# Actions are opt-in and per project. Nothing is pulled/recreated unless listed:
#   compose_stacks_projects:
#     - {name: 20-radarr, state: started, pull: true}   # state: started | stopped
compose_stacks_projects: []
# Never touched by apply even if listed (networks/DNS others depend on).
compose_stacks_protected: [00-networks, 00-ddns]
# Variables that must already exist (non-empty) in global.env; the run fails early
# otherwise. global.env is OMV-managed and untracked, so secrets live there only.
compose_stacks_required_global_vars: []
# global.env VAR -> Bitwarden item name (password field). Bitwarden is the source of truth;
# the run fails if the live global.env value differs. Needs BW_SESSION exported.
# Value is a Bitwarden item name (password field) or {item: <name>, field: <custom field name>}.
compose_stacks_global_env_bitwarden: {}

# --- update.yml (safe update with verification + rollback), see README ---
# Projects (dir names) to skip in an update run, in addition to compose_stacks_protected.
compose_update_skip: []
# Limit a run to these projects (empty = every RUNNING project under the base dir): -e '{"compose_update_only":["20-radarr"]}'
compose_update_only: []
# Seconds to wait for running(+healthy) after `up -d`, then seconds it must stay up with no restarts.
compose_update_timeout: 240
compose_update_settle: 20
# Refuse to pull when the docker root has less free space than this (GiB).
compose_update_min_free_gb: 20

# Controller-side checkout of cbhomelab/docker-compose; reference for env_heal.yml (restores per-project
# .env files that OMV reset to an empty header-only stub). `git -C <dir> pull` before running.
compose_stacks_repo_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/docker-compose"
