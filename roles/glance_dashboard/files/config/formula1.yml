- name: Formula 1
  show-mobile-header: true
  # Optionally, if you only have a single page you can hide the desktop navigation for a cleaner look
  # hide-desktop-navigation: true
  head-widgets:
    - type: html
      source: |
        <div class="widget-header"><h2>VIDEOS</h2></div>
    - type: group
      widgets:
        - type: videos
          title: Formula 1
          channels:
            - UCB_qr75-ydFVKSF9Dmo6izg # Formula 1
        - type: videos
          title: Missed Apex
          channels:
            - UCh0DXE29XstuMbLrghZdgHA # Missed Apex

  columns:
    - size: small
      widgets:
        - type: html
          source: |
            <div class="widget-header"><h2>CURRENT SEASON</h2></div>
        - type: group
          widgets:
            - type: custom-api
              title: Next
              cache: 5m
              url: http://${F1_API_URL}:4463/f1/next_race/
              template: |
                <div class="flex flex-column gap-10">
                  {{ $session := index (.JSON.Array "race") 0 }}
                  <p class="size-h5">
                    {{ .JSON.String "season" }}, Round {{ .JSON.String "round" }}
                  </p>

                  <div class="margin-block-4">
                    <p class="color-highlight">{{ $session.String "raceName" }}</p>
                    <p class="color-primary">
                      <span>
                        {{ .JSON.String "next_event.session" }}
                      </span>
                      {{ $datetime := .JSON.String "next_event.datetime" }}
                      <span
                        class="color-highlight"
                        {{ parseRelativeTime "rfc3339" $datetime }}
                      ></span>
                    </p>
                    <p class="size-h5">
                      {{ .JSON.String "next_event.date" }} @  {{ .JSON.String "next_event.time" }}
                    </p>

                    <div style="margin-block: 1rem;">
                      <img
                        src="http://${F1_API_URL}:4463/f1/next_map/"
                        onerror="this.style.display='none'"
                        style="max-width: 100%; height: auto; border-radius: 8px;"
                      />
                    </div>

                    <p class="color-highlight">
                      Circuit Details
                    </p>
                    <p class="size-h6">
                      Name: {{ $session.String "circuit.circuitName" }}
                    </p>
                    <p class="size-h6">
                      Lap Record: {{ $session.String "circuit.lapRecord" }}, {{ $session.String "circuit.fastestLapDriverName" }} ({{ $session.String "circuit.fastestLapYear"}})
                    </p>
                    <p class="size-h6">
                      Length: {{ $session.String "laps" }} laps @ {{ $session.String "circuit.circuitLengthKm" }} KMs
                    </p>
                  </div>
                </div>

            - type: custom-api
              title: Drivers
              cache: 5m
              url: http://${F1_API_URL}:4463/f1/drivers_standings/
              template: |
                <ul class="list collapsible-container" data-collapse-after="3">
                  {{ range $i, $v := .JSON.Array "drivers" }}
                  <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                    <div class="grow min-width-0">
                      <span>{{ .String "position" }}. {{ .String "surname" }} <img src="https://flagcdn.com/w20/{{ .String "flag" }}.png"
                            alt=""
                            style="width: 20px; height: 14px; object-fit: cover; vertical-align: middle"
                            class="inline-block rounded-sm" /> </span>
                      {{ $id := .String "teamId" }}
                        <span class="size-h6">
                          ( {{- if eq $id "red_bull" -}}Red Bull
                          {{- else if eq $id "aston_martin" -}}Aston Martin
                          {{- else if eq $id "mercedes" -}}Mercedes
                          {{- else if eq $id "ferrari" -}}Ferrari
                          {{- else if eq $id "mclaren" -}}McLaren
                          {{- else if eq $id "williams" -}}Williams
                          {{- else if eq $id "alpine" -}}Alpine
                          {{- else if eq $id "haas" -}}Haas
                          {{- else if eq $id "rb" -}}RB
                          {{- else if eq $id "sauber" -}}Sauber
                          {{- else -}}{{ $id }}{{- end -}})
                        </span>
                    </div>
                    <span class="shrink-0 text-right">{{ .String "points" }}</span>
                  </li>
                  {{ end }}
                </ul>

            - type: custom-api
              title: Constructors
              cache: 5m
              url: http://${F1_API_URL}:4463/f1/constructors_standings/
              template: |
                <ul class="list collapsible-container" data-collapse-after="5">
                  {{ range $i, $v := .JSON.Array "constructors" }}
                  <li class="flex items-center {{ if eq $i 0 }}color-primary{{ else if eq $i 1 }}color-highlight{{ end }}">
                    <span class="grow min-width-0">
                      {{ .String "position" }}. {{ .String "team" }}<span style="margin-left: 2px;">
                        <img src="https://flagcdn.com/w20/{{ .String "flag" }}.png"
                            alt=""
                            style="width: 20px; height: 14px; object-fit: cover; vertical-align: middle"
                            class="inline-block rounded-sm" />
                      </span>
                    </span>
                    <span class="shrink-0 text-right">{{ .String "points" }}</span>
                  </li>
                  {{ end }}
                </ul>


        - type: bookmarks
          groups:
            - links:
                - title: Formula1.com
                  url: https://www.formula1.com/
                - title: Fantasy Formula 1
                  url: https://fantasy.formula1.com/en/?utm_source=web_formula1.com&utm_medium=internal_referral&utm_campaign=navigation
                - title: F1TV
                  url: https://f1tv.formula1.com/
            # - title: Tools
            #   color: 10 70 50
            #   links:
            #     - title: Garage61
            #       url: https://garage61.net/
            # - title: Paint Resources
            #   color: 200 50 50
            #   links:
            #     - title: Trading Paints
            #       url: https://www.tradingpaints.com/
            # - title: Endurance Planning
            #   color: 29 100 39
            #   links:
            #     - title: iRacePlan
            #       url: https://iraceplan.com/

    - size: full
      widgets:
        - type: html
          source: |
            <div class="widget-header"><h2>NEWS</h2></div>
        - type: group
          define: &shared-properties
            type: rss
            limit: ${FEED_LIMIT}
            collapse-after: ${COLLAPSE_AFTER}
            cache: 12h
            style: detailed-list
          widgets:
            - title: BBC
              <<: *shared-properties
              feeds:
                - url: https://feeds.bbci.co.uk/sport/formula1/rss.xml
                  title: BBC News
            - title: Motorsport.com
              <<: *shared-properties
              feeds:
                - url: https://www.motorsport.com/rss/f1/news/
                  title: Motorsport.com
    - size: full
      widgets:
        - type: html
          source: |
            <div class="widget-header"><h2>SUBREDDITS</h2></div>
        - type: group
          define: &shared-properties
            type: reddit
            show-thumbnails: true
            limit: ${FEED_LIMIT}
            collapse-after: ${COLLAPSE_AFTER_REDDIT}
          widgets:    
            - subreddit: formula1
              <<: *shared-properties


