---
# backup: borg file-level backups of irreplaceable data, run on saturn (omv).
# Proxmox guest backups are NOT here: they are the PVE job `weekly-saturn`
# (vzdump -> NFS storage saturn-backups, keep-last=2, Sun 03:00).
backup_enabled: false
backup_borg_repo_base: /srv/dev-disk-by-uuid-61a64705-b6f5-4dfa-bc5a-8b5b9f04c475/backups/borg
backup_borg_schedule: "*-*-* 02:00:00"
backup_borg_keep: {daily: 7, weekly: 4, monthly: 2}
# Unencrypted by decision (repos live on our own disk).
backup_borg_archives:
  - name: personal
    paths:
      - /srv/mergerfs/Personal/ally
      - /srv/mergerfs/Personal/bishop
      - /srv/mergerfs/Personal/christian
      - /srv/mergerfs/Personal/kelly
    excludes: []
  - name: appdata
    paths: [/srv/dev-disk-by-uuid-f09af9c4-de31-424e-a995-41147cfcbb0a/appdata]
    excludes:   # caches, trash, regenerable or already-monitored data
      - "*/krusader"
      - "*/prometheus"
      - "*/loki"
      - "*/tdarr"
      - "*/tdarr2"
      - "*/MediaCover"
      - "*/image-proxy"
      - "*/data.ms"
      - "*/Cache"
      - "*/cache"
      - "*.log"
  - name: homelab
    paths: [/opt/docker-compose, /srv/remotemount/homeassistant]
    excludes: ["*/.git", "*/home-assistant.log*", "*/home-assistant_v2.db*", "*/__pycache__"]

# Proxmox host config (runs on neptune, writes a small tar to the NFS storage).
backup_pve_config_enabled: false
backup_pve_config_dest: /mnt/pve/saturn-backups/neptune-config
backup_pve_config_keep: 8
backup_pve_config_schedule: "Sun *-*-* 04:00:00"
backup_pve_config_paths: [/etc/pve, /etc/vzdump.conf, /etc/network/interfaces, /etc/hosts, /etc/fstab, /etc/ssh/sshd_config, /etc/apt/sources.list.d, /root/.ssh/authorized_keys]

# Monitoring: metrics via node_exporter textfile collector + Prometheus rules (saturn).
backup_metrics_enabled: false
backup_metrics_textfile_dir: /var/lib/node_exporter/textfile
backup_vzdump_dir: "{{ backup_borg_repo_base | dirname }}/dump"
backup_neptune_config_dir: "{{ backup_borg_repo_base | dirname }}/neptune-config"
backup_prometheus_rules_dir: /srv/dev-disk-by-uuid-f09af9c4-de31-424e-a995-41147cfcbb0a/appdata/prometheus/config
