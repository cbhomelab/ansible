---
# Dev only (by hand, once): clone the repo to {{ itd_data }}/src (git checkout, owned by the dev user).
# The env file is rendered below. Needs BW_SESSION exported on the controller (vault unlocked).
- name: Data dir (for env)
  ansible.builtin.file: {path: "{{ itd_data }}", state: directory, owner: "{{ itd_uid }}", group: "{{ itd_gid }}", mode: "0755"}

- name: Read secrets from Bitwarden
  ansible.builtin.set_fact:
    itd_secrets: "{{ itd_secrets | default({}) | combine({item: (lookup('community.general.bitwarden', itd_vault_prefix ~ '/' ~ item, field='password') | first | default('', true))}) }}"
  loop: "{{ itd_vault_required + itd_vault_optional + (itd_mumble_vault if itd_mumble else []) }}"
  no_log: true

- name: Required secrets present
  ansible.builtin.assert:
    that: itd_secrets[item] | length > 0
    fail_msg: "Bitwarden item {{ itd_vault_prefix }}/{{ item }} is missing or empty"
  loop: "{{ itd_vault_required + (itd_mumble_vault if itd_mumble else []) }}"
  no_log: true

- name: Render env file
  ansible.builtin.template: {src: env.j2, dest: "{{ itd_env_file }}", mode: "0600", owner: root, group: root}
  no_log: true
  register: itd_env_rendered

- name: Mumble env file and data dir
  when: itd_mumble
  block:
    - ansible.builtin.template: {src: mumble.env.j2, dest: "{{ itd_mumble_env_file }}", mode: "0600", owner: root, group: root}
      no_log: true
      register: itd_mumble_env_rendered
    - ansible.builtin.file: {path: "{{ itd_mumble_data }}", state: directory, owner: "{{ itd_uid }}", group: "{{ itd_gid }}", mode: "0755"}

- name: Data dirs
  ansible.builtin.file: {path: "{{ item.p }}", state: directory, owner: "{{ item.o | default(itd_uid) }}", group: "{{ item.g | default(itd_gid) }}", mode: "{{ item.m | default('0755') }}"}
  loop:
    - {p: "{{ itd_dir }}", o: root}
    - {p: "{{ itd_data }}"}
    - {p: "{{ itd_data }}/pgdata", o: 70, g: 70, m: "0700"}
    - {p: "{{ itd_data }}/logs", o: "{{ itd_dev_mode | ternary(itd_uid, itd_app_uid) }}", g: "{{ itd_dev_mode | ternary(itd_gid, itd_app_gid) }}"}
    - {p: "{{ itd_backup_dir }}", o: root}
  loop_control: {label: "{{ item.p }}"}

- name: Uploads dir (prod)
  ansible.builtin.file: {path: "{{ itd_data }}/uploads", state: directory, owner: "{{ itd_app_uid }}", group: "{{ itd_app_gid }}", mode: "0755"}
  when: not itd_dev_mode

- name: Persistent WebUI branding + flag uploads dirs (prod)
  # These live under webui/static inside the image; without a bind mount every container recreate wipes
  # the uploaded favicon/icon (branding) and flag images.
  ansible.builtin.file: {path: "{{ itd_data }}/{{ item }}", state: directory, owner: "{{ itd_app_uid }}", group: "{{ itd_app_gid }}", mode: "0755"}
  loop: [static-branding, static-flags]
  when: not itd_dev_mode

- name: Dev source must be a checkout already
  ansible.builtin.stat: {path: "{{ itd_data }}/src/.git"}
  register: itd_src
  failed_when: not itd_src.stat.exists
  when: itd_dev_mode

- name: Dev git access (read-only GitHub deploy key, so the checkout can fetch/pull)
  when: itd_dev_mode
  block:
    - name: Deploy key pair (generated once, never overwritten)
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N "" -C "{{ itd_name }}-deploy@saturn" -f {{ itd_data }}/deploy_key
        creates: "{{ itd_data }}/deploy_key"
    - name: Deploy key ownership
      ansible.builtin.file: {path: "{{ item }}", owner: "{{ itd_dev_uid | default(itd_uid) }}", group: "{{ itd_gid }}", mode: "0600"}
      loop: ["{{ itd_data }}/deploy_key"]
    - name: Public key (register it as a read-only deploy key on the GitHub repo)
      ansible.builtin.slurp: {src: "{{ itd_data }}/deploy_key.pub"}
      register: itd_deploy_pub
    - name: Checkout uses the deploy key
      ansible.builtin.command:
        cmd: git config --file {{ itd_data }}/src/.git/config core.sshCommand "ssh -i {{ itd_data }}/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
      register: itd_sshcmd
      changed_when: false
      check_mode: false
    - name: Show public key
      ansible.builtin.debug: {msg: "{{ itd_deploy_pub.content | b64decode | trim }}"}

- name: Prod source (pinned ref, shipped from the controller with git archive)
  when: not itd_dev_mode
  block:
    - name: Resolve ref
      delegate_to: localhost
      become: false
      ansible.builtin.shell: git ls-remote {{ itd_repo }} {{ itd_ref }} | head -1 | cut -f1
      register: itd_sha
      changed_when: false
      check_mode: false
    - name: Deployed marker
      ansible.builtin.slurp: {src: "{{ itd_dir }}/src/.deployed-commit"}
      register: itd_marker
      failed_when: false
    - name: Ship source when the commit changed
      when: (itd_marker.content | default('') | b64decode | trim) != (itd_sha.stdout | trim)
      block:
        - delegate_to: localhost
          become: false
          ansible.builtin.shell: |
            set -e; t=$(mktemp -d); git clone -q {{ itd_repo }} $t/r; git -C $t/r archive --format=tar.gz {{ itd_sha.stdout | trim }} -o /tmp/{{ itd_name }}-src.tgz; rm -rf $t
          changed_when: true
        - ansible.builtin.file: {path: "{{ itd_dir }}/src", state: absent}
        - ansible.builtin.file: {path: "{{ itd_dir }}/src", state: directory, mode: "0755"}
        - ansible.builtin.unarchive: {src: "/tmp/{{ itd_name }}-src.tgz", dest: "{{ itd_dir }}/src"}
        - ansible.builtin.copy: {dest: "{{ itd_dir }}/src/.deployed-commit", content: "{{ itd_sha.stdout | trim }}\n", mode: "0644"}
          register: itd_shipped

- name: compose.yml
  ansible.builtin.template: {src: compose.yml.j2, dest: "{{ itd_dir }}/compose.yml", mode: "0644"}
  register: itd_compose

- name: Backup script + nightly cron
  ansible.builtin.template: {src: backup.sh.j2, dest: "/usr/local/sbin/{{ itd_name }}-backup", mode: "0750"}
- ansible.builtin.cron:
    name: "{{ itd_name }}-backup"
    hour: "{{ itd_backup_hour }}"
    minute: "{{ itd_backup_minute }}"
    job: "/usr/local/sbin/{{ itd_name }}-backup >/dev/null 2>&1"

- name: Build and start
  ansible.builtin.command: docker compose up -d --build
  args: {chdir: "{{ itd_dir }}"}
  register: itd_up
  changed_when: "itd_env_rendered.changed or (itd_mumble_env_rendered.changed | default(false)) or 'Started' in itd_up.stderr or 'Created' in itd_up.stderr or 'Recreated' in itd_up.stderr or itd_compose.changed or (itd_shipped.changed | default(false))"

- name: Healthy (checked inside the container; the host cannot reach its own macvlan IP)
  ansible.builtin.command: docker exec {{ itd_name }} curl -fsS http://localhost:8000/health
  register: itd_health
  retries: 30
  delay: 5
  until: itd_health.rc == 0
  changed_when: false
