---
# iRacing Team Manager as a compose stack on saturn (replaces roles/iracing_tms on neptune LXCs 106/111).
# One stack per instance: Postgres on a private network + the app on a macvlan IP (mgmt_bridge, outside the DHCP pool).
# Instance vars (set per play): itd_name, itd_ip, itd_ref, itd_dev_mode.
itd_repo: git@github.com:cbhomelab/iracing-team-manager.git
itd_ref: main
itd_dev_mode: false
itd_nvme: /srv/dev-disk-by-uuid-d66051ef-e45a-4ade-8c47-b4cd6feddbe7
itd_dir: "/opt/{{ itd_name }}"                 # compose.yml (+ prod source on the root disk)
itd_data: "{{ itd_nvme }}/{{ itd_name }}"      # pgdata, uploads, logs, env, dev source (NVMe)
itd_env_file: "{{ itd_data }}/env"             # rendered by this role from the plain settings below + Bitwarden secrets
itd_uid: 1006
itd_gid: 100
# Prod runs as the image's appuser (it owns /app/webui/static etc.); runtime dirs are chowned to match.
itd_app_uid: 999
itd_app_gid: 999
itd_dns: ["10.10.0.1"]
itd_network: mgmt_bridge                       # existing external macvlan on br0 (10.20.0.0/24)
itd_pg_image: postgres:16-alpine
itd_backup_dir: "{{ itd_nvme }}/{{ itd_name }}-backups"
itd_backup_keep: 14
itd_backup_hour: 3
itd_backup_minute: 30

# --- env file (rendered by the role) ---
# Plain settings live here; override per instance with itd_env_overrides (play vars). Secrets live in Bitwarden
# (folder Homelab-Infra), one Login per value named "<itd_vault_prefix>/<VAR>" with the value in the password field.
itd_env_plain:
  APP_ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  APP_PORT: "8000"
  APP_BIND: 0.0.0.0
  APP_NAME: iRacing Team Manager
  ADMIN_USERNAME: admin
  POSTGRES_DB: iracing_tms
  POSTGRES_USER: iracing_user
  DISCORD_BOT_ENABLED: "false"       # set true (itd_env_overrides) once DISCORD_BOT_TOKEN is in the vault
  SCHEDULER_ENABLED: "true"
  SCHEDULER_SYNC_INTERVAL_HOURS: "6"
  SCHEDULER_SCRAPER_INTERVAL_HOURS: "24"
  SCHEDULER_SYNC_EVENTS: "false"     # no event parameters to match against yet
  SCRAPER_REQUEST_DELAY: "1.0"
  SCRAPER_USER_AGENT: iRacing-Team-Manager/1.0
  SCRAPER_MAX_RETRIES: "3"
  IRACING_JSON_API_URL: https://members.iracing.com/membership/json
  USE_STATIC_JSON: "true"            # load cars/classes/tracks from the JSON archive (the live API path 301s)
  WEBUI_TITLE: iRacing Team Manager
  WEBUI_TEMPLATE_DIR: app/webui/templates
itd_env_overrides: {}
itd_vault_prefix: "{{ itd_name | replace('iracing-tms-', 'itms-') }}"
itd_vault_required: [SECRET_KEY, ADMIN_PASSWORD, POSTGRES_PASSWORD]
itd_vault_optional: [DISCORD_BOT_TOKEN, GITHUB_ISSUES_TOKEN, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_GUILD_ID, DISCORD_ADMIN_ROLE_ID]

# --- Mumble voice server, bundled in this stack (per instance; off unless itd_mumble: true) ---
# Own macvlan IP on itd_network for clients (tcp+udp 64738). ICE (6502) is bound inside the private `internal`
# network only, so the app reaches it at mumble:6502 and nothing else can. Secrets come from Bitwarden as above.
itd_mumble: false
itd_mumble_ip: ""
itd_mumble_image: mumblevoip/mumble-server:latest
itd_mumble_data: "{{ itd_data }}/mumble"
itd_mumble_env_file: "{{ itd_data }}/mumble.env"
itd_mumble_welcome: "iRacing Team Manager voice"
itd_mumble_max_users: 30
itd_mumble_vault: [MUMBLE_ICE_SECRET, MUMBLE_SERVER_PASSWORD, MUMBLE_SUPERUSER_PASSWORD]
# ICE listens only on this address inside the stack's private network (never on the macvlan IP). Pick a subnet
# not used by another docker network (docker network ls) and a free address in it.
itd_internal_subnet: ""
itd_mumble_internal_ip: ""
