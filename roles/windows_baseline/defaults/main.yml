---
# windows_baseline: CB-GAMING (Windows 11 Pro, OpenSSH + PowerShell, no Python).
# Uses ansible.windows / community.windows modules (PowerShell-native, work
# over SSH with ansible_shell_type=powershell). See README.md.

windows_baseline_timezone: "Pacific Standard Time"

# --- OpenSSH server -------------------------------------------------------
# Key-only auth. Safe to enable because the controller already logs in by
# key; role validates with `sshd -t` BEFORE restarting sshd.
windows_baseline_ssh_password_auth: false
# Public keys that must be present in administrators_authorized_keys
# (christian is in Administrators, so Windows reads THIS file, not
# ~/.ssh/authorized_keys). Append-only: existing keys are never removed.
windows_baseline_ssh_admin_keys:
  - "{{ lookup('ansible.builtin.file', '~/.ssh/christian_windows.pub') | trim }}"

# --- Hardening -----------------------------------------------------------
windows_baseline_disable_smb1: true
windows_baseline_rdp_require_nla: true
windows_baseline_disable_builtin_admin: true
windows_baseline_defender_realtime: true
windows_baseline_firewall_profiles_enabled: true

# --- Power ---------------------------------------------------------------
# Ultimate Performance scheme. Never sleep on AC (Sunshine/Moonlight host).
# Matched by NAME (the live scheme is a duplicate with its own GUID).
windows_baseline_power_scheme_name: "Ultimate Performance"
windows_baseline_power_monitor_timeout_ac: 0
windows_baseline_power_standby_timeout_ac: 0

# --- Packages (winget) ----------------------------------------------------
# Layered: every Windows host gets `core`; each host then opts into named
# sets via `windows_baseline_package_sets` (set in host_vars/group_vars).
# `windows_baseline_winget_packages` is a per-host free-form extra list.
windows_baseline_winget_core:
  - Mozilla.Firefox
  - 7zip.7zip
  - CodeSector.TeraCopy
  - VideoLAN.VLC
  - Bitwarden.Bitwarden
  - voidtools.Everything
  - WinDirStat.WinDirStat
  - Microsoft.PowerToys
  - Microsoft.PowerShell
  - Microsoft.WindowsTerminal
  - Microsoft.VisualStudioCode
  - Tailscale.Tailscale
  - Microsoft.VCRedist.2015+.x64
  - Microsoft.VCRedist.2015+.x86

windows_baseline_package_sets_available:
  gaming:
    - Valve.Steam
    - EpicGames.EpicGamesLauncher
    - GOG.Galaxy
    - Playnite.Playnite
    - Discord.Discord
    - MoonlightGameStreamingProject.Moonlight
    - ClassicOldSong.Apollo
    - ViGEm.ViGEmBus
    - beeradmoore.dlss-swapper
    - File-New-Project.EarTrumpet
    - Logitech.OptionsPlus
    - Mojang.MinecraftLauncher
    - PrismLauncher.PrismLauncher
  dev:
    - Git.Git
    - twpayne.chezmoi
    - Starship.Starship
    - Docker.DockerDesktop
    - OpenJS.NodeJS
    - Python.Python.3.13
    - GitHub.cli
    - GitHub.GitHubDesktop
    - Microsoft.WSL
    - PuTTY.PuTTY
    - Gyan.FFmpeg
    - Mattermost.MattermostDesktop
    - RaspberryPiFoundation.RaspberryPiImager
  media_tools:
    - Plex.Plex
    - Plex.Plexamp
    - MusicBrainz.Picard
    - AppWork.JDownloader
  creative:
    - Adobe.CreativeCloud
    - SoftFever.OrcaSlicer
    - ShareX.ShareX
    - Obsidian.Obsidian
  homelab:
    - Syncthing.Syncthing
    - Ngrok.Ngrok
    - BornToBeRoot.NETworkManager

windows_baseline_package_sets: []
windows_baseline_winget_packages: []
# Package IDs never auto-upgraded by `--tags updates` (drivers / things
# that can break a working setup).
windows_baseline_winget_exclude:
  - ViGEm.ViGEmBus
  - Microsoft.WSL
  - Tailscale.Tailscale

# --- Windows Update (tag: updates, never runs by default) -----------------
windows_baseline_update_categories:
  - SecurityUpdates
  - CriticalUpdates
  - UpdateRollups
  - DefinitionUpdates
# Auto-restart if an update requires it. false = report only.
windows_baseline_update_reboot: false

# --- Local accounts -------------------------------------------------------
# Catalog of people lives in group_vars/windows.yml (windows_baseline_user_catalog).
# Each host lists which of them exist on it (windows_baseline_users) and which
# are local admins (windows_baseline_admins). Accounts not listed for a host
# are never created, and accounts outside the catalog are never touched.
# Passwords are always managed: Bitwarden item `bw_item` (field: password) is
# enforced on every run. If the item is missing the account's password is left
# alone and a warning is shown.
windows_baseline_user_catalog: {}
windows_baseline_users: []
# Local admins on every PC. Merged with per-host windows_baseline_admins.
windows_baseline_global_admins: [christian]
windows_baseline_admins: []

# --- Apollo stream hooks ---------------------------------------------------
# Wires StreamHooks.ps1 (PC-Mode-Switcher repo, "Apollo Hooks" dir) into
# Apollo's global_prep_cmd: stop InputLeap/SyncTrayzor while streaming, start
# them back after, and force displays back to the current mode's preset.
# Only enabled per-host (the scripts live in christian's repo checkout).
windows_baseline_apollo_hooks_enabled: false
windows_baseline_apollo_conf: 'C:\Program Files\Apollo\config\sunshine.conf'
windows_baseline_apollo_hooks_script: 'D:\Users\christian\Documents\Repos\Mode Switch Powershell Scripts\Apollo Hooks\StreamHooks.ps1'

# --- VLAN trunk (Hyper-V external vSwitch + tagged host vNICs) ------------
# The Realtek NIC driver only supports ONE tag for the whole NIC, so extra
# VLANs are done with an external Hyper-V vSwitch: the default host vNIC stays
# untagged (native VLAN) and each extra VLAN gets its own tagged host vNIC.
# Needs the matching tagged ports on the switch (core-sw, see docs).
windows_baseline_vlan_trunk_enabled: false
windows_baseline_vlan_switch_name: "LAN-Trunk"
windows_baseline_vlan_physical_adapter: "Ethernet"
# Interface metric for the tagged vNICs: keeps the default route on the untagged LAN.
windows_baseline_vlan_extra_metric: 500
windows_baseline_vlan_adapters: []   # [{name: MGMT, id: 2, mac: "00155D001100"}, ...]  (mac pins the vNIC for Kea reservations)
