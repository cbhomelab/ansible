---
- name: OpenSSH server config + keys
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: Security hardening
  ansible.builtin.import_tasks: hardening.yml
  tags: [hardening]

- name: Local accounts
  ansible.builtin.import_tasks: users.yml
  tags: [users]

- name: Power and time settings
  ansible.builtin.import_tasks: system.yml
  tags: [system]

- name: Package + Windows Update management
  ansible.builtin.import_tasks: updates.yml
  # no tags here: import_tasks inherits them, which made `--tags packages`
  # also run the [never, updates] tasks. Inner tasks carry their own tags.

- name: Apollo stream hooks
  ansible.builtin.import_tasks: apollo.yml
  tags: [apollo]

- name: VLAN trunk (Hyper-V vSwitch + tagged host vNICs)
  ansible.builtin.import_tasks: vlans.yml
  tags: [vlans]
