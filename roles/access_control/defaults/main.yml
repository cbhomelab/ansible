---
# Default (empty) access control model. Override per-group/per-host in
# group_vars/host_vars. Each entry is intentionally a no-op until wired up.

access_control_groups: []
# Example shape:
# access_control_groups:
#   - name: media
#     gid: 1006
#     system: false

access_control_users: []
# Example shape:
# access_control_users:
#   - name: christian
#     groups: [sudo]
#     shell: /bin/bash
#     ssh_authorized_keys:
#       - "{{ lookup('community.general.bitwarden', 'homelab-ssh-christian', field='notes') }}"

access_control_sudoers: []
# Example shape:
# access_control_sudoers:
#   - name: christian
#     rule: "christian ALL=(ALL) NOPASSWD:ALL"
# Drop-in filename is always "/etc/sudoers.d/<name>-nopasswd" regardless of
# the exact rule text, so scoping a rule down later doesn't require a
# matching filename change.

# SSH password-auth hardening is OFF by default. Flip to true per-group (or
# per-host) ONLY after confirming key-based login works for every account
# on that host — this is deliberately not a blanket "all" default so a
# typo'd/missing key can't lock a host out.
access_control_disable_password_auth: false
