---
# Disable SSH password authentication. Gated behind
# access_control_disable_password_auth (default false, see defaults/main.yml)
# so this never flips on before key-based login has been verified for every
# account on the host — getting this wrong locks everyone out.

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*PasswordAuthentication\s+\S+'
    line: "PasswordAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  when: access_control_disable_password_auth | bool
  notify: Restart sshd

- name: Disable SSH keyboard-interactive authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*KbdInteractiveAuthentication\s+\S+'
    line: "KbdInteractiveAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  when: access_control_disable_password_auth | bool
  notify: Restart sshd

- name: Disable SSH challenge-response authentication (older sshd)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*ChallengeResponseAuthentication\s+\S+'
    line: "ChallengeResponseAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"
  become: true
  when: access_control_disable_password_auth | bool
  notify: Restart sshd
