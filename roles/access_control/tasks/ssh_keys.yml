---
# Install SSH authorized_keys for declared users. SSH key material is
# pulled from Bitwarden at runtime via group_vars (see defaults for shape) —
# nothing plaintext lives in this repo.

- name: Install SSH authorized_keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_authorized_keys | join('\n') }}"
    exclusive: "{{ item.ssh_exclusive | default(false) }}"
    state: present
  loop: "{{ access_control_users }}"
  when: item.ssh_authorized_keys | default([]) | length > 0
  become: true
