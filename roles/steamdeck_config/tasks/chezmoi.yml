---
- name: chezmoi drift (read-only; scripts excluded)
  ansible.builtin.command: "{{ steamdeck_config_chezmoi_bin }} status --exclude=scripts"
  register: steamdeck_config_chezmoi_status
  changed_when: false
  check_mode: false

- name: Report dotfile drift
  ansible.builtin.debug:
    msg: "{{ steamdeck_config_chezmoi_status.stdout_lines }}"
  when: steamdeck_config_chezmoi_status.stdout_lines | length > 0

- name: Apply dotfiles (opt-in)
  ansible.builtin.command: "{{ steamdeck_config_chezmoi_bin }} apply --exclude=scripts"
  register: steamdeck_config_chezmoi_apply
  changed_when: steamdeck_config_chezmoi_status.stdout_lines | length > 0
  when: steamdeck_config_chezmoi_status.stdout_lines | length > 0
  tags: [never, chezmoi_apply]
