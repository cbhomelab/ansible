---
- name: Ensure Flatpaks are installed (system installation)
  become: true
  community.general.flatpak:
    name: "{{ item }}"
    remote: flathub
    method: system
    state: present
  loop: "{{ steamdeck_config_flatpaks }}"

- name: Check third-party Flatpaks are present
  ansible.builtin.command: "flatpak info {{ item }}"
  loop: "{{ steamdeck_config_flatpaks_check_only }}"
  register: steamdeck_config_fp_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report missing third-party Flatpaks
  ansible.builtin.debug:
    msg: "{{ item.item }} is NOT installed (needs its own remote; manual)"
  loop: "{{ steamdeck_config_fp_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
