---
- name: SSH access (christian's key)
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: Flatpaks (system, flathub)
  ansible.builtin.import_tasks: flatpak.yml
  tags: [flatpak]

- name: Decky plugins (verify)
  ansible.builtin.import_tasks: decky.yml
  tags: [decky]

- name: chezmoi dotfiles
  ansible.builtin.import_tasks: chezmoi.yml
  when: steamdeck_config_chezmoi_enabled
  tags: [chezmoi]

- name: Prompt tooling (Starship, Nerd Font, Konsole profile)
  ansible.builtin.import_tasks: prompt.yml
  when: steamdeck_config_nerdfont_enabled
  tags: [prompt]

- name: Sunshine (root config under Docky) + DeckyHub tab setting
  ansible.builtin.import_tasks: sunshine.yml
  tags: [sunshine]
