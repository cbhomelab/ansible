---
# Two things that run against EXISTING guests, via the API (never destroys):
#  1. protect_only: set protection=1 on guests the role doesn't otherwise manage
#  2. update mode: for guests with `update: true`, PUT only the keys that differ
#     (whitelist below). Hot-applicable keys take effect immediately; some
#     (features, cores/memory on LXC) may need a guest restart - reported, never forced.
- name: Build API helpers
  ansible.builtin.set_fact:
    pg_base: "https://{{ proxmox_guests_api.api_host }}:{{ proxmox_guests_api.api_port }}/api2/json/nodes/{{ proxmox_guests_node }}"
    pg_auth: "PVEAPIToken={{ proxmox_guests_api.api_user }}!{{ proxmox_guests_api.api_token_id }}={{ proxmox_guests_api.api_token_secret }}"
  no_log: true

- name: Protection on unmanaged guests - current config
  ansible.builtin.uri:
    url: "{{ pg_base }}/{{ item.type }}/{{ item.vmid }}/config"
    headers: {Authorization: "{{ pg_auth }}"}
    validate_certs: false
  loop: "{{ proxmox_guests_protect_only }}"
  loop_control: {label: "{{ item.vmid }}"}
  register: pg_prot
  no_log: true
  check_mode: false

- name: Protection on unmanaged guests - set where missing
  ansible.builtin.uri:
    url: "{{ pg_base }}/{{ item.item.type }}/{{ item.item.vmid }}/config"
    method: PUT
    headers: {Authorization: "{{ pg_auth }}"}
    body_format: form-urlencoded
    body: {protection: 1}
    validate_certs: false
  loop: "{{ pg_prot.results }}"
  loop_control: {label: "{{ item.item.vmid }}"}
  when: (item.json.data.protection | default(0) | int) != 1 and not ansible_check_mode
  no_log: true
  changed_when: true

# ---- drift report + update mode ----
# Every declared guest (create lists + proxmox_guests_adopted) is compared to live config and
# differences are reported. Only guests with `update: true` are changed.
- name: Drift - current config of declared guests
  ansible.builtin.uri:
    url: "{{ pg_base }}/{{ item.type }}/{{ item.vmid }}/config"
    headers: {Authorization: "{{ pg_auth }}"}
    validate_certs: false
  loop: "{{ (proxmox_guests_lxc | map('combine', {'type': 'lxc'}) | list) + (proxmox_guests_vms | map('combine', {'type': 'qemu'}) | list) + proxmox_guests_adopted }}"
  loop_control: {label: "{{ item.vmid }}"}
  register: pg_upd
  no_log: true
  check_mode: false

- name: Drift - compute differences
  ansible.builtin.set_fact:
    pg_diffs: >-
      {%- set out = [] -%}
      {%- for r in pg_upd.results -%}
      {%- set want = {} -%}
      {%- for k in proxmox_guests_update_keys[r.item.type] -%}
      {%- if r.item[k] is defined -%}
      {%- set raw = r.item[k] -%}
      {%- set v = (raw | join(',')) if k == 'features' else ((raw | join(';')) if k == 'tags' else ((1 if raw else 0) if raw is boolean else raw)) -%}
      {%- set cur = r.json.data[k] | default('') | string -%}
      {%- if (cur.split(',') | sort | join(',') if k == 'features' else cur) != (v.split(',') | sort | join(',') if k == 'features' else v | string) -%}{%- set _ = want.update({k: v}) -%}{%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if want -%}{%- set _ = out.append({'vmid': r.item.vmid, 'type': r.item.type, 'set': want, 'update': r.item.get('update', false) | bool}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Drift - report
  ansible.builtin.debug:
    msg: "{{ item.type }}/{{ item.vmid }} {{ 'WILL UPDATE' if item.update else 'DRIFT (update not enabled)' }}: {{ item.set }}"
  loop: "{{ pg_diffs }}"
  loop_control: {label: "{{ item.vmid }}"}

- name: Update mode - apply differences (update true only)
  ansible.builtin.uri:
    url: "{{ pg_base }}/{{ item.type }}/{{ item.vmid }}/config"
    method: PUT
    headers: {Authorization: "{{ pg_auth }}"}
    body_format: form-urlencoded
    body: "{{ item.set }}"
    validate_certs: false
  loop: "{{ pg_diffs | selectattr('update') | list }}"
  loop_control: {label: "{{ item.vmid }}"}
  when: not ansible_check_mode
  no_log: true
  changed_when: true
