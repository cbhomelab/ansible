---
- name: Require API credentials in the environment (source ~/.config/proxmox/env)
  ansible.builtin.assert:
    that: [proxmox_guests_api.api_host | length > 0, proxmox_guests_api.api_token_secret | length > 0]
    fail_msg: "PVE_HOST / PVE_TOKEN_ID / PVE_TOKEN_SECRET not set. Run: set -a; . ~/.config/proxmox/env; set +a"
  no_log: true

- name: Existing guests (for the pre-flight check)
  ansible.builtin.uri:
    url: "https://{{ proxmox_guests_api.api_host }}:{{ proxmox_guests_api.api_port }}/api2/json/cluster/resources?type=vm"
    headers:
      Authorization: "PVEAPIToken={{ proxmox_guests_api.api_user }}!{{ proxmox_guests_api.api_token_id }}={{ proxmox_guests_api.api_token_secret }}"
    validate_certs: false
    return_content: true
  register: pg_existing
  no_log: true
  check_mode: false

- name: Pre-flight - static IPs must be outside DHCP pools, unreserved and unused
  ansible.builtin.command: "python3 {{ role_path }}/files/preflight.py"
  args:
    stdin: "{{ pg_preflight | to_json }}"
  vars:
    pg_ids: "{{ pg_existing.json.data | map(attribute='vmid') | list }}"
    pg_preflight: >-
      {%- set out = [] -%}
      {%- for g in proxmox_guests_lxc -%}
      {%- set _ = out.append({'id': g.vmid ~ ' ' ~ g.hostname, 'ip': g.ip | default('dhcp'), 'exists': g.vmid in pg_ids}) -%}
      {%- endfor -%}
      {%- for g in proxmox_guests_vms -%}
      {%- set _ = out.append({'id': g.vmid ~ ' ' ~ g.name, 'ip': g.ip | default('dhcp'), 'exists': g.vmid in pg_ids}) -%}
      {%- endfor -%}
      {{ out }}
  register: pg_pre
  changed_when: false
  check_mode: false
  when: (proxmox_guests_lxc + proxmox_guests_vms) | length > 0
  failed_when: pg_pre.rc != 0
  environment:
    OPN_HOST: "{{ lookup('env', 'OPN_HOST') }}"
    OPN_KEY: "{{ lookup('env', 'OPN_KEY') }}"
    OPN_SECRET: "{{ lookup('env', 'OPN_SECRET') }}"

- name: Guest management
  module_defaults:
    group/community.proxmox.proxmox:
      "{{ proxmox_guests_api }}"
  block:
    - name: LXC - create/update
      community.proxmox.proxmox:
        node: "{{ proxmox_guests_node }}"
        vmid: "{{ item.vmid }}"
        hostname: "{{ item.hostname }}"
        ostemplate: "{{ item.ostemplate }}"
        cores: "{{ item.cores | default(1) }}"
        memory: "{{ item.memory | default(512) }}"
        swap: "{{ item.swap | default(256) }}"
        disk: "{{ item.disk | default('local-lvm:8') }}"
        netif:
          net0: "name=eth0,bridge={{ item.bridge | default('vmbr0') }},ip={{ item.ip | default('dhcp') }}{{ (',gw=' ~ item.gw) if item.gw is defined else '' }}{{ (',tag=' ~ item.vlan) if item.vlan | default(none) else '' }}"
        nameserver: "{{ item.nameserver | default(omit) }}"
        onboot: "{{ item.onboot | default(true) }}"
        unprivileged: "{{ item.unprivileged | default(true) }}"
        features: "{{ item.features | default(['nesting=1'] if item.nesting | default(false) else omit) }}"
        tags: "{{ item.tags | default(['ansible']) }}"
        pubkey: "{{ proxmox_guests_ssh_pubkeys | join('\n') if proxmox_guests_ssh_pubkeys else omit }}"
        state: present
        update: false   # existing guests are changed only by extras.yml (update: true per guest)
      loop: "{{ proxmox_guests_lxc }}"
      loop_control: {label: "{{ item.vmid }} {{ item.hostname }}"}
      register: pg_lxc

    - name: LXC - protection flag (module has no option; PUT via API)
      ansible.builtin.uri:
        url: "https://{{ proxmox_guests_api.api_host }}:{{ proxmox_guests_api.api_port }}/api2/json/nodes/{{ proxmox_guests_node }}/lxc/{{ item.vmid }}/config"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_guests_api.api_user }}!{{ proxmox_guests_api.api_token_id }}={{ proxmox_guests_api.api_token_secret }}"
        body_format: form-urlencoded
        body: {protection: "{{ 1 if item.protection | default(true) else 0 }}"}
        validate_certs: false
      loop: "{{ proxmox_guests_lxc }}"
      loop_control: {label: "{{ item.vmid }}"}
      no_log: true
      changed_when: false

    - name: LXC - TUN device for Tailscale/VPN (raw lxc.* lines; the API and module cannot set these)
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ item.0.vmid }}.conf"
        regexp: "^{{ item.1.key | regex_escape }}:"
        line: "{{ item.1.key }}: {{ item.1.value }}"
        insertbefore: '^\['     # keep raw keys above any [snapshot] section
        firstmatch: true
        create: false
      delegate_to: "{{ proxmox_guests_node }}"
      become: true
      register: pg_tun
      loop: "{{ pg_tun_pairs }}"
      loop_control: {label: "{{ item.0.vmid }} {{ item.1.key }}"}
      vars:
        ansible_connection: ssh   # the play is connection: local; delegation would inherit that
        pg_tun_lines:
          - {key: lxc.cgroup2.devices.allow, value: "c 10:200 rwm"}
          - {key: lxc.mount.entry, value: "/dev/net/tun dev/net/tun none bind,create=file"}
        pg_tun_pairs: "{{ proxmox_guests_lxc | selectattr('tun', 'defined') | selectattr('tun') | product(pg_tun_lines) | list }}"

    - name: LXC - start
      community.proxmox.proxmox:
        node: "{{ proxmox_guests_node }}"
        vmid: "{{ item.vmid }}"
        state: started
      loop: "{{ proxmox_guests_lxc | selectattr('start', 'undefined') | list + proxmox_guests_lxc | selectattr('start', 'defined') | selectattr('start') | list }}"
      loop_control: {label: "{{ item.vmid }}"}
      when: proxmox_guests_start

    - name: VM - clone from the cloud-init template (skipped if the name exists)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_guests_node }}"
        clone: "{{ proxmox_guests_template_name }}"
        vmid: "{{ proxmox_guests_template_vmid }}"
        newid: "{{ item.vmid }}"
        name: "{{ item.name }}"
        full: true
        storage: "{{ item.storage | default(proxmox_guests_template_storage) }}"
        timeout: 300
      loop: "{{ proxmox_guests_vms }}"
      loop_control: {label: "{{ item.vmid }} {{ item.name }}"}
      register: pg_vm_clone

    - name: VM - first-boot settings (only on freshly cloned VMs; update=true is never idempotent)
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_guests_node }}"
        vmid: "{{ item.item.vmid }}"
        name: "{{ item.item.name }}"
        cores: "{{ item.item.cores | default(2) }}"
        memory: "{{ item.item.memory | default(2048) }}"
        ciuser: "{{ item.item.ciuser | default('hermes') }}"
        sshkeys: "{{ proxmox_guests_ssh_pubkeys | join('\n') }}"
        ipconfig:
          ipconfig0: "ip={{ item.item.ip | default('dhcp') }}{{ (',gw=' ~ item.item.gw) if item.item.gw is defined else '' }}"
        nameservers: "{{ item.item.nameserver | default(omit) }}"
        onboot: "{{ item.item.onboot | default(true) }}"
        tags: "{{ item.item.tags | default(['ansible']) }}"
        protection: "{{ item.item.protection | default(true) }}"
        update: true
      loop: "{{ pg_vm_clone.results }}"
      loop_control: {label: "{{ item.item.vmid }}"}
      when: item.changed

    - name: VM - grow disk when requested (freshly cloned only)
      community.proxmox.proxmox_disk:
        vmid: "{{ item.item.vmid }}"
        disk: scsi0
        size: "{{ item.item.disk_gb }}G"
        state: resized
      loop: "{{ pg_vm_clone.results }}"
      loop_control: {label: "{{ item.item.vmid }}"}
      when: item.changed and item.item.disk_gb is defined

    - name: VM - start
      community.proxmox.proxmox_kvm:
        node: "{{ proxmox_guests_node }}"
        vmid: "{{ item.vmid }}"
        state: started
      loop: "{{ proxmox_guests_vms }}"
      loop_control: {label: "{{ item.vmid }}"}
      when: proxmox_guests_start
