---
# proxmox_guests: create/update guests on neptune via the Proxmox API (token auth).
# CREATE + UPDATE ONLY. state=absent is deliberately not supported; destroying
# a guest is a manual step. Every guest gets protection=1 by default.
#
# VMID convention: 110-149 services, 900+ templates. 100-109 are pre-existing
# and unmanaged here.
proxmox_guests_node: neptune
proxmox_guests_api:
  api_host: "{{ lookup('env', 'PVE_HOST') }}"
  api_port: "{{ lookup('env', 'PVE_PORT') | default(8006, true) }}"
  api_user: hermes@pve
  api_token_id: "{{ lookup('env', 'PVE_TOKEN_ID') | regex_replace('^.*!', '') }}"
  api_token_secret: "{{ lookup('env', 'PVE_TOKEN_SECRET') }}"
  validate_certs: false

# --- cloud-init VM template (built over SSH on the host, guarded by vmid) ---
proxmox_guests_template_enabled: false
proxmox_guests_template_vmid: 900
proxmox_guests_template_name: tpl-debian13-cloudinit
proxmox_guests_template_storage: local-lvm
proxmox_guests_template_image_url: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
proxmox_guests_template_image_dir: /var/lib/vz/template/iso
proxmox_guests_template_bridge: vmbr0

# --- guests ---
# proxmox_guests_lxc:
#   - {vmid: 110, hostname: foo, ostemplate: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst",
#      cores: 1, memory: 512, swap: 256, disk: "local-lvm:8", ip: 10.20.0.50/24, gw: 10.20.0.1,
#      bridge: vmbr0, vlan: null, nameserver: 10.20.0.x, onboot: true, tags: [ansible], nesting: false}
# proxmox_guests_vms:
#   - {vmid: 111, name: bar, cores: 2, memory: 2048, disk_gb: 20, ip: 10.20.0.51/24, gw: 10.20.0.1, ciuser: hermes, tags: [ansible]}
proxmox_guests_lxc: []
proxmox_guests_vms: []
proxmox_guests_ssh_pubkeys: []     # root/ciuser keys injected at create time
proxmox_guests_start: true

# --- existing guests (extras.yml) ---
# Guests to only set protection=1 on: [{vmid: 100, type: qemu}, {vmid: 102, type: lxc}, ...]
proxmox_guests_protect_only: []
# Per-guest `update: true` makes the role PUT any differing keys from this whitelist.
proxmox_guests_update_keys:
  lxc: [cores, memory, swap, onboot, tags, features, nameserver]
  qemu: [cores, memory, onboot, tags, agent]
