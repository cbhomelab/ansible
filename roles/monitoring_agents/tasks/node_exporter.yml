---
# node_exporter: pinned upstream binary + systemd unit, bound to the host's
# MGMT address only. Check-mode safe: download/unpack/service steps that need
# a not-yet-present artifact are skipped or tolerated under --check.

- name: Check installed node_exporter version
  ansible.builtin.command: "{{ monitoring_agents_node_exporter_bin }} --version"
  register: monitoring_agents_ne_ver
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [monitoring_agents, node_exporter]

- name: Work out whether the pinned node_exporter needs installing
  ansible.builtin.set_fact:
    monitoring_agents_ne_needs_install: >-
      {{ monitoring_agents_ne_ver.rc != 0 or
         ('version ' ~ monitoring_agents_node_exporter_version ~ ' ') not in
         (monitoring_agents_ne_ver.stdout ~ monitoring_agents_ne_ver.stderr) }}
  tags: [monitoring_agents, node_exporter]

- name: node_exporter system user
  ansible.builtin.user:
    name: "{{ monitoring_agents_node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    comment: Prometheus node_exporter
  tags: [monitoring_agents, node_exporter]

- name: Download pinned node_exporter tarball (sha256-verified)
  ansible.builtin.get_url:
    url: "{{ monitoring_agents_node_exporter_url }}"
    dest: "{{ monitoring_agents_node_exporter_tarball }}"
    checksum: "sha256:{{ monitoring_agents_node_exporter_sha256 }}"
    mode: "0644"
  when: monitoring_agents_ne_needs_install
  tags: [monitoring_agents, node_exporter]

- name: Install node_exporter binary
  ansible.builtin.unarchive:
    src: "{{ monitoring_agents_node_exporter_tarball }}"
    dest: "{{ monitoring_agents_node_exporter_bin | dirname }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    extra_opts:
      - --strip-components=1
      - --wildcards
      - "*/node_exporter"
  when: monitoring_agents_ne_needs_install and not ansible_check_mode
  notify: Restart node_exporter
  tags: [monitoring_agents, node_exporter]

- name: node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ monitoring_agents_node_exporter_textfile_dir }}"
    state: directory
    mode: "0755"
  when: monitoring_agents_node_exporter_textfile_dir | default("") | length > 0

- name: node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter
  tags: [monitoring_agents, node_exporter]

- name: Flush handlers so a restart happens before the enable/start check
  ansible.builtin.meta: flush_handlers
  tags: [monitoring_agents, node_exporter]

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [monitoring_agents, node_exporter]
