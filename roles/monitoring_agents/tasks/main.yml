---
# monitoring_agents: two independent components.
#   promtail.yml      - file app logs -> Loki (only hosts with jobs defined)
#   node_exporter.yml - host metrics scraped by Prometheus on saturn
# import_tasks (not include) so --tags and --check behave statically; the
# `when` propagates to every imported task. No meta: end_host, so a host
# with no Promtail jobs still gets node_exporter.

- name: Promtail (file app logs)
  ansible.builtin.import_tasks: promtail.yml
  when: monitoring_agents_promtail_enabled and (monitoring_agents_promtail_jobs | length > 0)

- name: node_exporter (host metrics)
  ansible.builtin.import_tasks: node_exporter.yml
  when: monitoring_agents_node_exporter_enabled
