---
# network_appliances: entry point. DHCP reservations (OPNsense/Kea) is the
# first real config surface — see README.md "Scope" for what's still
# scaffolded (UniFi, OPNsense firewall rules/VLANs).

- name: network_appliances disabled — skip
  ansible.builtin.debug:
    msg: "network_appliances_enabled is false — no appliance config changes made."
  when: not network_appliances_enabled

- name: DHCP reservations (OPNsense/Kea)
  ansible.builtin.include_tasks: dhcp_reservations.yml
  when: network_appliances_enabled

- name: Unbound DNS records (OPNsense, from NPM)
  ansible.builtin.include_tasks:
    file: unbound_dns.yml
    apply:
      tags: [unbound_dns]
  when: network_appliances_enabled and network_appliances_unbound_enabled
  tags: [unbound_dns]
