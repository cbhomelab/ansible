---
# network_appliances defaults — DHCP reservations surface (t_022a83c7).
# UniFi config management and OPNsense firewall/VLAN surfaces are still
# scaffolded/not implemented — see README.md "Scope".

network_appliances_enabled: true

# Set true only once you've reviewed the check-mode plan output and are
# ready to actually write to the live router. Defaults to false (plan-only)
# on purpose — this touches a live router's DHCP config.
network_appliances_dhcp_apply: true

network_appliances_opnsense:
  api_base_url: "https://10.20.0.1"
  # Needs a user/group with at least "Services: Kea DHCP" + "Services:
  # DHCPv4" page privileges — the existing `homelab-opnsense-api` Bitwarden
  # item referenced from group_vars/appliances.yml is documented there as
  # read-only (status/syslog use), which is NOT sufficient for the writes
  # this role makes. See README.md "Credentials" before running for real.
  api_key: "{{ lookup('community.general.bitwarden', 'homelab-opnsense-dhcp-api', field='username') | first }}"
  api_secret: "{{ lookup('community.general.bitwarden', 'homelab-opnsense-dhcp-api', field='password') | first }}"

# CIDR of the LAN subnet reservations are created in. Used to resolve the
# Kea subnet UUID via kea/dhcpv4/search_subnet (OPNsense doesn't take a
# plain CIDR on add_reservation — it wants the subnet's internal UUID).
network_appliances_dhcp_subnet_cidr: "10.20.0.0/24"

# Built from inventory in tasks/dhcp_reservations.yml: every host across
# lxc_guests + vm_guests with `dhcp_reservation: true` and a `mac` set in
# inventory/hosts.yml. Not meant to be overridden directly; override the
# inventory vars instead.

network_appliances_unifi:
  api_base_url: "https://10.20.0.107"
  username: ""
  password: ""
  # Session-cookie auth (not a static API key) — see README.md. UniFi
  # config management is still out of scope for this pass.

# ---- Unbound DNS (split-horizon cbhomelab.net -> NPM) ------------------
# Source of truth is the live NPM proxy-host list. See tasks/unbound_dns.yml.
# Plan-only unless network_appliances_unbound_apply is true.
network_appliances_unbound_enabled: true
network_appliances_unbound_apply: false
network_appliances_unbound_domain: cbhomelab.net
# NPM (LXC 102). Same IP as the lxc102-intranet inventory host.
network_appliances_unbound_target_ip: "{{ hostvars['lxc102-intranet'].ansible_host }}"
# Records this role owns carry this in their description; nothing else is
# ever modified/deleted.
network_appliances_unbound_marker: "ansible:network_appliances unbound_dns (NPM proxy host)"
# Names not in NPM that should still resolve (short or fqdn under the domain).
network_appliances_unbound_extra_hosts: ["intranet.cbhomelab.net"]
network_appliances_unbound_exclude_hosts: []
# Delete managed records whose NPM host no longer exists.
network_appliances_unbound_prune: false
# Remove any Unbound domain-override forward for the zone (e.g. the old
# cbhomelab.net -> Pi-hole forward) so Pi-hole is out of the path.
network_appliances_unbound_remove_forward: true
# Resolver used for the post-apply verification (run from the control node).
network_appliances_unbound_resolver: 10.10.0.1

network_appliances_npm:
  host: "{{ hostvars['lxc102-intranet'].ansible_host }}:81"
  identity: "{{ lookup('community.general.bitwarden', 'homelab-npm-admin', field='username') | first }}"
  secret: "{{ lookup('community.general.bitwarden', 'homelab-npm-admin', field='password') | first }}"
