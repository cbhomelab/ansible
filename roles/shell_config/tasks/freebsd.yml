---
# OPNsense (FreeBSD 13.2, no python): Starship prompt for `christian`.
# The router is API-managed (ansible_connection: local) so playbooks/shell.yml
# reaches it through a dynamic add_host over SSH as christian (hermes's key is
# in christian's authorized_keys on the router).
# Everything is `raw` - no interpreter on the target. chezmoi is not used:
# starship.toml is fetched straight from the dotfiles repo.
#
# christian's login shell is bash (pkg install bash, set in the OPNsense UI),
# so the hook is the normal `starship init bash` in ~/.bashrc. (FreeBSD 13.2
# /bin/sh can't do this: libedit strips the colour escapes from PS1.)

- name: Install Starship, starship.toml and the bash hook
  ansible.builtin.raw: |
    set -e
    changed=no
    mkdir -p "$HOME/.local/bin" "$HOME/.config"
    if ! "$HOME/.local/bin/starship" --version 2>/dev/null | grep -q "{{ shell_config_starship_version }}"; then
      fetch -q -o /tmp/starship.tgz "https://github.com/starship/starship/releases/download/v{{ shell_config_starship_version }}/starship-x86_64-unknown-freebsd.tar.gz"
      tar xzf /tmp/starship.tgz -C "$HOME/.local/bin" && rm -f /tmp/starship.tgz
      changed=yes
    fi
    fetch -q -o /tmp/starship.toml "{{ shell_config_freebsd_starship_toml_url }}"
    if ! cmp -s /tmp/starship.toml "$HOME/.config/starship.toml"; then
      cp /tmp/starship.toml "$HOME/.config/starship.toml"; changed=yes
    fi
    rm -f /tmp/starship.toml
    printf '%s\n' \
      '# Managed by ansible (shell_config/freebsd.yml)' \
      'case $- in *i*)' \
      '  export PATH="$HOME/.local/bin:$PATH"' \
      '  eval "$(starship init bash)"' \
      '  ;;' \
      'esac' > /tmp/bashrc_new
    printf '%s\n' \
      '# Managed by ansible (shell_config/freebsd.yml)' \
      '[ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"' > /tmp/bash_profile_new
    for f in bashrc bash_profile; do
      if ! cmp -s /tmp/${f}_new "$HOME/.$f"; then cp /tmp/${f}_new "$HOME/.$f"; changed=yes; fi
      rm -f /tmp/${f}_new
    done
    # retire the old sh-based hook
    if grep -q "^ *# Starship prompt" "$HOME/.shrc"; then
      sed -i '' -e '/^ *# Starship prompt/,$d' "$HOME/.shrc"; changed=yes
    fi
    echo "CHANGED=$changed"
  register: shell_config_freebsd_result
  changed_when: "'CHANGED=yes' in shell_config_freebsd_result.stdout"
  failed_when: shell_config_freebsd_result.rc != 0
