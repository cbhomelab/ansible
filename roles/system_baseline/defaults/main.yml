---
# system_baseline: master switch. Default OFF so a host only gets this role's
# changes when a group_vars/host_vars file opts it in (see inventory).
system_baseline_enabled: false

# Components (each independently toggleable per host/group)
system_baseline_packages_enabled: true
system_baseline_timezone_enabled: true
system_baseline_journald_enabled: true
system_baseline_unattended_upgrades: true

system_baseline_base_packages:
  - curl
  - vim
  - htop
  - rsync
  - tmux
  - jq
  - ca-certificates

system_baseline_timezone: "America/Los_Angeles"

# journald size cap
system_baseline_journald_max_use: "200M"

# unattended-upgrades: SECURITY updates from Debian's own security archive
# only. Third-party repos (tailscale, openresty, corretto, UniFi, mongodb,
# OMV, ...) are never matched, so they are never auto-upgraded.
# Reboots are never automatic; a reboot-required flag is left for a human.
system_baseline_uu_automatic_reboot: false
system_baseline_uu_remove_unused: false

# Tailscale: opt-in per host (set true only on LXCs with tun: true). Lookup is lazy:
# Bitwarden is only queried when a join is actually needed.
system_baseline_tailscale_enabled: false
system_baseline_tailscale_bw_item: tailscale-ansible-authkey
system_baseline_tailscale_authkey: "{{ lookup('community.general.bitwarden', system_baseline_tailscale_bw_item, field='password') | first }}"
system_baseline_tailscale_up_args: []
