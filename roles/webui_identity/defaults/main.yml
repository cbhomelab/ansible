---
# webui_identity defaults.
#
# Each entry in webui_identity_accounts describes ONE account to create on
# ONE service. `service` must match a tasks/<service>.yml file name exactly
# (main.yml does `include_tasks: "{{ item.service }}.yml"`).
#
# Common keys (not every service uses every key — see each tasks/<service>.yml
# for what it actually reads off `item`):
#   service        - proxmox | omv | unifi | npm | home_assistant | grafana |
#                    opnsense | pihole
#   username       - target login name (almost always "christian" for this
#                    rollout; kept as a field rather than hardcoded so this
#                    role stays reusable for other per-service accounts later)
#   password       - target account's new password (Bitwarden lookup)
#   api_base_url   - host[:port] for that service's API/WebUI (no scheme)
#   extra          - free-form dict of whatever else that service's task
#                    file needs (bootstrap admin creds to authenticate the
#                    create call, API key/secret pairs, email, etc.)
#
# ORDERING CONSTRAINT: this role's tasks talk to each service's own account
# store and are independent of each other, but several of them assume
# prerequisites from OTHER in-flight work:
#   - proxmox.yml assumes the OS user `christian` already exists on
#     `neptune` (created by roles/access_control) — Proxmox's `@pam` realm
#     authenticates against system users, so granting a WebUI role to
#     christian@pam before that OS user exists would grant a role to a
#     login that can't actually authenticate yet.
#   - Every task file that needs a password/API key assumes those secrets
#     are already populated in Bitwarden (see t_eab3e60d) rather than the
#     placeholder lookup names below.
# Do not run this role for real against live services until BOTH of those
# are true. Writing/reviewing the role code itself has no such dependency.
webui_identity_accounts: []
# Example shape, one entry per service (fill in real Bitwarden item names
# and wire into group_vars/all.yml — see that file for the consolidated
