---
# Minecraft (oddlama/minecraft-server framework: Velocity + Paper behind vane-velocity) as a compose stack on saturn.
# Replaces roles/minecraft (LXC 105). World/plugin/proxy data lives in a bind mount on the NVMe,
# imported once from the LXC 105 state (see tasks/main.yml header); the role never overwrites it.
minecraft_docker_dir: /opt/minecraft
minecraft_docker_data: /srv/dev-disk-by-uuid-d66051ef-e45a-4ade-8c47-b4cd6feddbe7/minecraft   # NVMe
minecraft_docker_backup_dir: /srv/dev-disk-by-uuid-d66051ef-e45a-4ade-8c47-b4cd6feddbe7/minecraft-backups
minecraft_docker_backup_keep: 7
minecraft_docker_uid: 1006
minecraft_docker_gid: 100
minecraft_docker_java: 25
minecraft_docker_mem_limit: 16g
minecraft_docker_max_heap_gib: 12      # start.sh sizes the heap from /proc/meminfo, which shows the HOST's RAM inside docker; this caps it
minecraft_docker_proxy_port: 25565
minecraft_docker_mux_port: 25566      # vane-velocity auth multiplexer
minecraft_docker_bluemap_port: 8100
# Velocity is pinned: the framework's update.sh would otherwise fetch an older build that rejects 26.x clients.
minecraft_docker_velocity_build: 49
minecraft_docker_velocity_jar: velocity-4.3.2-{{ minecraft_docker_velocity_build }}.jar
minecraft_docker_velocity_url: https://fill-data.papermc.io/v1/objects/74fa2a58d9c25aaff0354ae5c20be0a63b30391f8a3d0895ed517f354e3720ee/velocity-4.3.2-SNAPSHOT-49.jar
minecraft_docker_velocity_sha256: 74fa2a58d9c25aaff0354ae5c20be0a63b30391f8a3d0895ed517f354e3720ee
# Bedrock (Geyser + Floodgate on Velocity). LAN only; no WAN NAT is configured for it.
minecraft_docker_bedrock: true
minecraft_docker_geyser_port: 19133        # host UDP+TCP (RakNet + NetherNet signaling) -> Geyser 19132 in the container
minecraft_docker_geyser_webrtc_port: 19134 # host UDP, NetherNet data
minecraft_docker_geyser_url: https://download.geysermc.org/v2/projects/geyser/versions/2.12.1/builds/1303/downloads/velocity
minecraft_docker_geyser_sha256: 32b5dae5bf10f1fd9f6d8412b5ae3b6ac33bdff58a28e1630406bdc35cd75375
minecraft_docker_floodgate_url: https://download.geysermc.org/v2/projects/floodgate/versions/2.2.5/builds/141/downloads/velocity
minecraft_docker_floodgate_sha256: 649835022de37ff09255fc626d4bfe7bc2a3b926d07b0dfaf1f51e12bf37001d
# BedrockConnect lets consoles (Switch) pick this server: point the console's DNS at saturn, it listens on UDP 19132.
minecraft_docker_bedrockconnect: true
minecraft_docker_bedrockconnect_port: 19132
minecraft_docker_bedrockconnect_servers:
  - {name: CBHomelab, address: 10.20.0.2, port: 19133}
# Discord announcements (webhook kept in Bitwarden item below). Posts/edits a
# pinnable "how to connect" message and a notice ONLY when the required Java
# version or Geyser's Bedrock range changes (state: {{ minecraft_docker_dir }}/discord-state.json).
minecraft_docker_discord_enabled: true
minecraft_docker_discord_bw_item: homelab-minecraft-discord-webhook
minecraft_docker_discord_java_host: play.cbhomelab.net
minecraft_docker_discord_bedrock_host: minecraft.cbhomelab.net
minecraft_docker_dns: [10.20.0.1]     # explicit resolver; Paper hit UnknownHostException for Mojang hosts after a restart

# Offsite copy (rsync over ssh after each backup); empty host disables.
minecraft_docker_offsite_host: ""
minecraft_docker_offsite_user: hermes
minecraft_docker_offsite_inv: saturn
minecraft_docker_offsite_dir: /srv/dev-disk-by-uuid-d66051ef-e45a-4ade-8c47-b4cd6feddbe7/minecraft-backups
