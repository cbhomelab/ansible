---
# First-time data import from LXC 105 (done once, by hand, never by this role):
#   stop minecraft-proxy/server on 105, then
#   ssh lxc105 'sudo tar -C /var/lib -cf - minecraft' | ssh saturn 'sudo mkdir -p <data> && sudo tar -C <data> --strip-components=1 -xpf - && sudo chown -R 1006:100 <data>'
- name: Data dir must already be populated (import above)
  ansible.builtin.stat: {path: "{{ minecraft_docker_data }}/deploy/proxy/velocity.toml"}
  register: mcd_data
  failed_when: not mcd_data.stat.exists

- name: Velocity jar (pinned build)
  ansible.builtin.get_url:
    url: "{{ minecraft_docker_velocity_url }}"
    dest: "{{ minecraft_docker_data }}/deploy/proxy/{{ minecraft_docker_velocity_jar }}"
    checksum: "sha256:{{ minecraft_docker_velocity_sha256 }}"
    owner: "{{ minecraft_docker_uid }}"
    group: "{{ minecraft_docker_gid }}"
    mode: "0644"
  register: mcd_vjar

- name: velocity.jar -> pinned build
  ansible.builtin.file:
    src: "{{ minecraft_docker_velocity_jar }}"
    dest: "{{ minecraft_docker_data }}/deploy/proxy/velocity.jar"
    state: link
    owner: "{{ minecraft_docker_uid }}"
    group: "{{ minecraft_docker_gid }}"
  register: mcd_vlink

- name: Stop framework update.sh from re-downloading Velocity
  ansible.builtin.replace:
    path: "{{ minecraft_docker_data }}/deploy/proxy/update.sh"
    regexp: '^download_velocity velocity.jar$'
    replace: '# download_velocity velocity.jar  # pinned by ansible (minecraft_docker_velocity_*)'

- name: Fix vane-velocity config key casing (v1.23 reads AllowAnyone)
  ansible.builtin.replace:
    path: "{{ minecraft_docker_data }}/deploy/proxy/plugins/vane-velocity/config.toml"
    regexp: '^(\s*)allow_anyone\b'
    replace: '\1AllowAnyone'
  failed_when: false

- name: Geyser + Floodgate jars
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ minecraft_docker_data }}/deploy/proxy/plugins/{{ item.dest }}"
    checksum: "sha256:{{ item.sha }}"
    owner: "{{ minecraft_docker_uid }}"
    group: "{{ minecraft_docker_gid }}"
    mode: "0644"
  loop:
    - {url: "{{ minecraft_docker_geyser_url }}", sha: "{{ minecraft_docker_geyser_sha256 }}", dest: Geyser-Velocity.jar}
    - {url: "{{ minecraft_docker_floodgate_url }}", sha: "{{ minecraft_docker_floodgate_sha256 }}", dest: floodgate-velocity.jar}
  register: mcd_bedrock_jars
  when: minecraft_docker_bedrock

- name: Geyser config (exists after first start)
  ansible.builtin.stat: {path: "{{ minecraft_docker_data }}/deploy/proxy/plugins/Geyser-Velocity/config.yml"}
  register: mcd_geyser_cfg

- name: Geyser accepts direct RakNet joins as well as NetherNet (new Bedrock clients otherwise fail with 'terracotta')
  ansible.builtin.lineinfile:
    path: "{{ minecraft_docker_data }}/deploy/proxy/plugins/Geyser-Velocity/config.yml"
    regexp: "{{ item.re }}"
    line: "{{ item.line }}"
    backrefs: true
  loop:
    - {re: '^  transport:.*', line: '  transport: both'}
    - {re: '^  webrtc-port:.*', line: '  webrtc-port: 19134'}
  register: mcd_geyser_lines
  when: minecraft_docker_bedrock and mcd_geyser_cfg.stat.exists

- name: BedrockConnect server list
  ansible.builtin.file: {path: "{{ minecraft_docker_dir }}/bedrockconnect", state: directory, mode: "0755"}
  when: minecraft_docker_bedrock and minecraft_docker_bedrockconnect

- name: BedrockConnect custom_servers.json
  ansible.builtin.template: {src: custom_servers.json.j2, dest: "{{ minecraft_docker_dir }}/bedrockconnect/custom_servers.json", mode: "0644"}
  register: mcd_bc
  when: minecraft_docker_bedrock and minecraft_docker_bedrockconnect

- name: Packages (zstd for backups)
  ansible.builtin.apt: {name: zstd, state: present}

- name: Compose dir
  ansible.builtin.file: {path: "{{ minecraft_docker_dir }}", state: directory, mode: "0755"}

- name: Dockerfile + compose.yml
  ansible.builtin.template: {src: "{{ item.src }}", dest: "{{ minecraft_docker_dir }}/{{ item.dest }}", mode: "0644"}
  loop: [{src: Dockerfile.j2, dest: Dockerfile}, {src: compose.yml.j2, dest: compose.yml}]
  register: mcd_files

- name: Backup script
  ansible.builtin.template: {src: backup.sh.j2, dest: /usr/local/sbin/minecraft-backup, mode: "0750"}

- name: Weekly state backup (Sunday 04:15)
  ansible.builtin.cron: {name: minecraft-backup, weekday: "0", hour: "4", minute: "15", job: "/usr/local/sbin/minecraft-backup >/dev/null 2>&1"}

- name: Build and start
  ansible.builtin.command: docker compose up -d --build
  args: {chdir: "{{ minecraft_docker_dir }}"}
  register: mcd_up
  changed_when: "'Started' in mcd_up.stdout or 'Created' in mcd_up.stderr or 'Recreated' in mcd_up.stderr or mcd_files.changed or mcd_vjar.changed or mcd_vlink.changed or (mcd_bedrock_jars.changed | default(false)) or (mcd_geyser_lines.changed | default(false)) or (mcd_bc.changed | default(false))"

- name: Restart proxy when Bedrock plugins/config changed (compose up does not notice)
  ansible.builtin.command: docker restart minecraft-proxy
  when: (mcd_bedrock_jars.changed | default(false)) or (mcd_geyser_lines.changed | default(false))

- name: Proxy listening
  ansible.builtin.wait_for: {host: 127.0.0.1, port: "{{ minecraft_docker_proxy_port }}", timeout: 60}
