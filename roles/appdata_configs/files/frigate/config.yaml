    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door_sub
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      enabled: false
    snapshots:
      enabled: false
    birdseye:
      enabled: false
    record:
      enabled: true
      continuous:
        days: 21
      motion:
        days: 0
      alerts:
        retain:
