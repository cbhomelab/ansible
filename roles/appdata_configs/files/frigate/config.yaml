cameras:
  front_door: # <------ Name the camera
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      #enabled: false # <---- disable detection until you have a working camera feed
      fps: 7
      width: 640
      height: 480
    motion:
      mask:
    # Top-down porch view: nearly the whole frame is your own doormat/tile,
    # so one zone covering the usable floor is enough (not alert-restrictive,
    # just here for stats/debug visibility).
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.627,0.019,0.977,0.021,0.979,0.071,0.627,0.075
    zones:
      porch:
        friendly_name: Porch
        coordinates: 0.0,1.0,0.0,0.05,0.6,0.0,1.0,0.2,1.0,1.0
  garage: # <------ Name the camera
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/garage_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/garage
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      #enabled: false # <---- disable detection until you have a working camera feed
      fps: 7
      width: 640
      height: 480
    motion:
      mask:
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.625,0.026,0.973,0.028,0.975,0.066,0.627,0.068
      threshold: 43
      contour_area: 22
      improve_contrast: 'true'
    # Interior storage garage, not a perimeter view - no zones (clutter makes
    # them noise-prone), and no car tracking since no vehicles are ever in frame.
    objects:
      track:
        - person
#  gazebo: # <------ Name the camera
#    enabled: true
#    ffmpeg:
#      inputs:
#        - path: rtsp://127.0.0.1:8554/gazebo_sub
#          input_args: preset-rtsp-restream
#          roles:
#            - detect
#        - path: rtsp://127.0.0.1:8554/gazebo
#          input_args: preset-rtsp-restream
#          roles:
#            - record
#    detect:
#      enabled: false # <---- disable detection until you have a working camera feed
#      fps: 7
#      width: 640
#      height: 480
#    motion:
#      mask: 0.621,0.018,0.968,0.019,0.974,0.073,0.624,0.068
  front_yard: # <------ Name the camera
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_yard_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/front_yard
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      #enabled: false # <---- disable detection until you have a working camera feed
      fps: 10
      width: 1536
      height: 576
    motion:
      mask:
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.71,0.007,0.987,0.013,0.989,0.065,0.707,0.06
      contour_area: 6
    # Near zone (your driveway) vs far zone (the curb/sidewalk across the
    # street where the truck parks). Both zones require alerts now - people
    # messing with the truck or gate across the street need a push alert,
    # not a silent "detection" log entry.
    zones:
      driveway:
        friendly_name: Driveway
        coordinates: 0.28,1.0,0.30,0.40,1.0,0.33,1.0,1.0
      street:
        friendly_name: Street
        coordinates: 0.0,0.40,0.0,0.08,0.85,0.07,1.0,0.12,1.0,0.38
    review:
      alerts:
        required_zones:
          - driveway
          - street
  back_yard: # <------ Name the camera
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/back_yard_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/back_yard
          input_args: preset-rtsp-restream
          roles:
            - record
    detect:
      #enabled: false # <---- disable detection until you have a working camera feed
      fps: 7
      width: 1536
      height: 576
    motion:
      mask:
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.708,0.007,0.99,0.013,0.991,0.063,0.706,0.068
      contour_area: 8
    # Fully fenced private yard - no street/public area to separate out, so a
    # single zone covering the usable ground (lawn+patio) is enough; not
    # alert-restrictive since any person back here is already notable.
    zones:
      yard:
        friendly_name: Yard
        coordinates: 0.0,1.0,0.0,0.5,1.0,0.15,1.0,1.0
  doorbell: # <------ Name the camera
    enabled: true
    ffmpeg:
      # Software decode: VAAPI intermittently fails on this 640px H.264 stream (Failed to sync surface)
      hwaccel_args: []
      inputs:
        - path: rtsp://127.0.0.1:8554/doorbell
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      #enabled: false # <---- disable detection until you have a working camera feed
      width: 640
      height: 480
      fps: 5
    motion:
      mask:
    # Near zone (porch/walkway where a visitor actually stands) vs far zone
    # (street visible through the gap). Alerts restricted to the porch.
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.489,0.002,0.996,0.006,0.997,0.063,0.487,0.056
    zones:
      porch:
        friendly_name: Porch
        coordinates: 0.35,1.0,0.35,0.55,1.0,0.45,1.0,1.0
      street:
        friendly_name: Street
        coordinates: 0.0,0.75,0.0,0.35,0.68,0.35,0.5,0.75
    review:
      alerts:
        required_zones:
          - porch
  # baby_monitor: # <------ Name the camera
  #   enabled: true
