    # Indoor nursery - no vehicles will ever appear, skip car tracking.
        motion_mask_1:
          friendly_name: Motion Mask 1
          enabled: true
          coordinates: 0.64,0.01,0.988,0.012,0.988,0.077,0.642,0.068
    objects:
      track:
        - person
  front_door_cr: # continuous low-res recording only (sub stream) - workaround for record_sub not being in a released Frigate version yet
