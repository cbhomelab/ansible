#      - ffmpeg:gazebo_sub#audio=opus
    front_yard:
      # Duo 2 main is HEVC 4608x1728 (stitched dual-lens pano). Tried using it
      # for full-res recording on 2026-11-12 - it caused the camera itself to
      # drop BOTH its main and sub RTSP sessions every few minutes (confirmed
      # via repeated "Connection timed out" crashes, isolated to this camera
      # model only - front_door/garage with similar dual-stream setups never
      # crashed). This is a camera/firmware reliability issue with the Duo 2's
      # HEVC main encoder, not fixable in Frigate config. Reverted to sub-only.
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.15:554/h264Preview_01_sub
      - ffmpeg:front_yard#audio=opus
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.15:554/h264Preview_01_main
