    front_yard_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.15:554/h264Preview_01_sub
      - ffmpeg:front_yard_sub#audio=opus
      #- ffmpeg:http://10.50.0.15/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}
    back_yard:
      # Same Duo 2 main-stream reliability issue as front_yard - reverted to sub.
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.16:554/h264Preview_01_sub
      - ffmpeg:back_yard#audio=opus
      #- rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.16:554/h264Preview_01_main
      #- ffmpeg:http://10.50.0.16/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus
    back_yard_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.16:554/h264Preview_01_sub
      - ffmpeg:back_yard_sub#audio=opus
      #- ffmpeg:http://10.50.0.16/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}
    doorbell:
      - rtsp://admin:{FRIGATE_RTSP_PASSWORD}@10.30.0.113:554/cam/realmonitor?channel=1&subtype=0&authbasic=64
      - ffmpeg:doorbell#audio=opus
    doorbell_sub:
