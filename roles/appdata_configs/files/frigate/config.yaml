mqtt:
  host: mqtt.mgmt.cbho.me
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

ffmpeg:
  hwaccel_args: preset-vaapi

detectors: # <---- add detectors
  coral:
    type: edgetpu
    device: pci

objects:
  # Track person + car globally (default is person-only); car matters for
  # driveway/street coverage. Indoor cams override back to person-only below.
  track:
    - person
    - car
  filters:
    person:
      # Slightly more sensitive than Frigate defaults (min_score 0.5, threshold 0.7)
      # so borderline/distant people initiate tracking instead of being dropped.
      min_score: 0.45
      threshold: 0.65
    car:
      min_score: 0.45
      threshold: 0.65

record:
  enabled: true
  alerts:
    retain:
      days: 45
  detections:
    retain:
      days: 45
  continuous:
    days: 0
  motion:
    days: 10
snapshots:
  enabled: true
  retain:
    default: 30

go2rtc:
  streams:
    front_door:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.10:554/h264Preview_01_main
      - ffmpeg:front_door#audio=opus
      #- ffmpeg:http://10.50.0.10/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus
    front_door_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.10:554/h264Preview_01_sub
      - ffmpeg:front_door_sub#audio=opus
      #- ffmpeg:http://10.50.0.10/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}
    garage:
      #- ffmpeg:http://10.50.0.11/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.11:554/h264Preview_01_main
      - ffmpeg:garage#audio=opus
    garage_sub:
      #- ffmpeg:http://10.50.0.11/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.11:554/h264Preview_01_sub
      - ffmpeg:garage_sub#audio=opus
#    gazebo:
#      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@10.50.0.14:554/h264Preview_01_main
#      - ffmpeg:gazebo#audio=opus
#    gazebo_sub:
