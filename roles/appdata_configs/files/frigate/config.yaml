  #   objects:
  #     track:
  #       - person
  violet_bedroom: # <------ Name the camera
    enabled: true
    ffmpeg:
      output_args:
        record: preset-record-generic-audio-copy
      inputs:
        - path: rtsp://127.0.0.1:8554/violet_bedroom_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
        - path: rtsp://127.0.0.1:8554/violet_bedroom
          input_args: preset-rtsp-restream
          roles:
            - record
    onvif:
      host: 10.20.0.54
