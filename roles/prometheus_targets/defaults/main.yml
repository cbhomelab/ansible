---
# Generates Prometheus file_sd targets for node_exporter from the Ansible inventory,
# so new guests are scraped without hand-editing prometheus.yml.
prometheus_targets_appdata: /srv/dev-disk-by-uuid-f09af9c4-de31-424e-a995-41147cfcbb0a/appdata
prometheus_targets_groups: [lxc_guests, debian_vms, omv]
prometheus_targets_extra_hosts: [lxc107-unifi]
prometheus_targets_exclude: [lxc103-hermesagent]
prometheus_targets_port: 9100
prometheus_targets_compose: /opt/docker-compose/90-metrics/90-metrics.yml

# Extra scrape jobs appended to prometheus.yml (inside an Ansible-managed block). Targets are container names on the `docker` network.
prometheus_targets_extra_jobs: |
  - job_name: pve-jupiter
    # prometheus-pve-exporter module "jupiter": standalone node, read-only PVEAuditor token
    metrics_path: /pve
    params:
      module: [jupiter]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets: ['10.20.0.55']
        labels: {host: jupiter}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
  - job_name: cadvisor
    # per-container stats for every container on saturn (90-metrics/cadvisor)
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {host: saturn}
  - job_name: iracing-postgres
    # postgres_exporter sidecars from roles/iracing_tms_docker
    static_configs:
      - targets: ["iracing-tms-prod-pg-exporter:9187"]
        labels: {host: saturn, instance_name: iracing-tms-prod, env: prod}
