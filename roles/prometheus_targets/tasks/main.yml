---
- name: Build host list from inventory
  ansible.builtin.set_fact:
    prometheus_targets_hosts: >-
      {%- set out = [] -%}
      {%- for g in prometheus_targets_groups -%}{%- set _ = out.extend(groups.get(g, [])) -%}{%- endfor -%}
      {{ (out + prometheus_targets_extra_hosts) | unique | difference(prometheus_targets_exclude) | sort }}

- name: Targets dir
  ansible.builtin.file: {path: "{{ prometheus_targets_appdata }}/prometheus/config/targets", state: directory, mode: "0755"}

- name: node_exporter file_sd targets (file_sd re-reads this on change, no restart)
  ansible.builtin.template:
    src: node.yml.j2
    dest: "{{ prometheus_targets_appdata }}/prometheus/config/targets/node.yml"
    mode: "0644"

- name: Mount the targets directory into prometheus (compose edit)
  ansible.builtin.lineinfile:
    path: "{{ prometheus_targets_compose }}"
    insertafter: '^\s+- \$\{APPDATA_DIR\}/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
    line: "      - ${APPDATA_DIR}/prometheus/config/targets:/etc/prometheus/targets:ro"
    backup: true
  register: pt_compose

- name: Switch the node job from static_configs to file_sd
  ansible.builtin.replace:
    path: "{{ prometheus_targets_appdata }}/prometheus/config/prometheus.yml"
    regexp: '(  - job_name: node\n)    static_configs:\n(?:      - \{targets:.*\n)+'
    replace: '\1    file_sd_configs:\n      - files: ["/etc/prometheus/targets/node.yml"]\n'
  register: pt_cfg

- name: Recreate prometheus (new mount and/or replaced config file)
  ansible.builtin.command: >-
    docker compose --project-name 90-metrics --env-file /opt/docker-compose/global.env
    --env-file /opt/docker-compose/90-metrics/90-metrics.env
    -f /opt/docker-compose/90-metrics/90-metrics.yml -f /opt/docker-compose/90-metrics/compose.override.yml
    up -d --force-recreate prometheus
  when: pt_compose.changed or pt_cfg.changed
