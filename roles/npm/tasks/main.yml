---
- name: Services enabled and running
  ansible.builtin.systemd: {name: "{{ item }}", enabled: true, state: started}
  loop: [npm, openresty]

- name: Backup tooling
  ansible.builtin.apt: {name: [sqlite3, zstd], state: present, update_cache: true, cache_valid_time: 3600}

- name: Backup script (consistent sqlite .backup + certs + keys)
  ansible.builtin.copy:
    dest: /usr/local/sbin/npm-backup
    mode: "0750"
    content: |
      #!/bin/bash
      set -euo pipefail
      d={{ npm_backup_dir }}; t=$(mktemp -d); ts=$(date +%Y%m%dT%H%M%S)
      mkdir -p "$d"; chmod 700 "$d"
      sqlite3 /data/database.sqlite ".backup '$t/database.sqlite'"
      cp -a /data/keys.json /data/custom_ssl /data/letsencrypt "$t"/ 2>/dev/null || true
      cp -a /etc/letsencrypt "$t/etc-letsencrypt"
      tar -C "$t" -cf - . | zstd -q -o "$d/npm-$ts.tar.zst"
      rm -rf "$t"
      # verify before rotating: zstd frame ok, tar readable, sqlite present
      if ! { zstd -tq "$d/npm-$ts.tar.zst" && zstd -dcq "$d/npm-$ts.tar.zst" | tar -tf - | grep -c "^./database.sqlite$" >/dev/null; }; then rm -f "$d/npm-$ts.tar.zst"; echo "npm backup verify FAILED" >&2; exit 1; fi
      ls -1t "$d"/npm-*.tar.zst | tail -n +$(( {{ npm_backup_keep }} + 1 )) | xargs -r rm -f
      echo "$d/npm-$ts.tar.zst"

- name: Nightly backup
  ansible.builtin.cron:
    name: npm-backup
    user: root
    hour: "{{ npm_backup_hour }}"
    minute: "{{ npm_backup_minute }}"
    job: /usr/local/sbin/npm-backup >/dev/null 2>&1 || logger -p user.err -t npm-backup "backup FAILED"

- name: Health check (API status + major version)
  ansible.builtin.uri: {url: "http://127.0.0.1:{{ npm_port }}/api/", return_content: true}
  register: npm_health
  check_mode: false
  retries: 5
  delay: 3
  until: npm_health.status == 200
  failed_when: npm_health.status != 200 or npm_health.json.version.major != npm_expected_major

- ansible.builtin.debug:
    msg: "NPM {{ npm_health.json.version.major }}.{{ npm_health.json.version.minor }}.{{ npm_health.json.version.revision }} healthy"

- name: Proxy-host upstreams (npm_upstreams)
  when: npm_upstreams | length > 0
  block:
    - name: NPM API login
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ npm_port }}/api/tokens"
        method: POST
        body_format: json
        body: {identity: "{{ npm_admin_email }}", secret: "{{ npm_admin_pass }}"}
      register: npm_login
      no_log: true
      check_mode: false

    - name: List proxy hosts
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ npm_port }}/api/nginx/proxy-hosts"
        headers: {Authorization: "Bearer {{ npm_login.json.token }}"}
      register: npm_hosts
      no_log: true
      check_mode: false

    - name: Upstreams that differ from npm_upstreams
      ansible.builtin.set_fact:
        npm_drift: >-
          {{ npm_drift | default([]) + [{'id': h.id, 'domain': item.domain, 'host': item.host, 'port': item.port, 'body': h}] }}
      vars:
        h: "{{ (npm_hosts.json | selectattr('domain_names', 'contains', item.domain) | list | first) | default(none) }}"
      loop: "{{ npm_upstreams }}"
      when: h is not none and (h.forward_host != item.host or h.forward_port != item.port)
      no_log: true

    - name: Update drifted proxy host upstreams
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ npm_port }}/api/nginx/proxy-hosts/{{ item.id }}"
        method: PUT
        headers: {Authorization: "Bearer {{ npm_login.json.token }}"}
        body_format: json
        body: >-
          {{ item.body | dict2items | selectattr('key', 'in', npm_upstream_keep_fields) | list | items2dict
             | combine({'forward_host': item.host, 'forward_port': item.port}) }}
      changed_when: true
      loop: "{{ npm_drift | default([]) }}"
      loop_control: {label: "{{ item.domain }} -> {{ item.host }}:{{ item.port }}"}
