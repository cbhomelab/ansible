---
# Nginx Proxy Manager on lxc102 (native community-scripts install: /app + node, state in /data + /etc/letsencrypt).
# Proxy hosts are declared in npm_proxy_hosts below (created if missing, drifted fields updated, never deleted). NPM's sqlite DB remains
# what network_appliances reads to derive Unbound records. It also covers service state, backups and health.
npm_dir: /app
npm_port: 81
npm_backup_dir: /var/backups/npm
npm_backup_keep: 14
npm_backup_hour: 3
npm_backup_minute: 40
npm_expected_major: 2

# Proxy-host upstreams enforced by this role (only forward_host/forward_port are managed; everything else on
# the host is left as is). Hosts are matched by their first domain name. Add an entry when an upstream moves.
npm_upstreams:
  # arr apps share gluetun_arr (compose project 20-vpn-arr, saturn)
  - {domain: shows.cbhomelab.net,    host: 10.20.0.149, port: 8989}   # sonarr
  - {domain: movies.cbhomelab.net,   host: 10.20.0.149, port: 7878}   # radarr
  - {domain: lidarr.cbhomelab.net,   host: 10.20.0.149, port: 8686}
  - {domain: indexers.cbhomelab.net, host: 10.20.0.149, port: 9696}   # prowlarr
  # own gluetun each (20-sabnzbd, 20-qbittorrent)
  - {domain: sabnzbd.cbhomelab.net,      host: 10.20.0.150, port: 8080}
  - {domain: qbittorrent.cbhomelab.net,  host: 10.20.0.151, port: 8081}

npm_admin_email: "{{ lookup('community.general.bitwarden', 'homelab-npm-admin', field='username')[0] }}"
npm_admin_pass: "{{ lookup('community.general.bitwarden', 'homelab-npm-admin', field='password')[0] }}"
npm_upstream_keep_fields: [domain_names, forward_scheme, forward_host, forward_port, certificate_id, ssl_forced, hsts_enabled,
  hsts_subdomains, http2_support, block_exploits, caching_enabled, allow_websocket_upgrade, access_list_id, advanced_config,
  enabled, meta, locations]

# ---- Proxy hosts (full management) ----
