---
- name: Guard - secrets must be provided
  ansible.builtin.assert:
    that:
      - minecraft_forwarding_secret | length > 0
      - minecraft_discord_bot_token | length > 0
    fail_msg: "Secrets missing. Run via scripts/minecraft_secrets.sh (reads Bitwarden)."
  no_log: true

- name: Prerequisites
  ansible.builtin.apt:
    name: [tmux, git, curl, wget, jq, unzip, python3, gnupg, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Corretto apt key
  ansible.builtin.shell: curl -fsSL https://apt.corretto.aws/corretto.key | gpg --dearmor -o /usr/share/keyrings/corretto-keyring.gpg
  args: {creates: /usr/share/keyrings/corretto-keyring.gpg}

- name: Corretto apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/corretto.list
    content: "deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main\n"
    mode: "0644"
  register: corretto_repo

- name: Java
  ansible.builtin.apt:
    name: "{{ minecraft_java_packages }}"
    state: present
    update_cache: "{{ corretto_repo.changed }}"

- name: Service group
  ansible.builtin.group: {name: "{{ minecraft_user }}", system: true}

- name: Service user
  ansible.builtin.user:
    name: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    system: true
    home: "{{ minecraft_home }}"
    shell: /bin/sh
    create_home: true

- name: Home permissions
  ansible.builtin.file: {path: "{{ minecraft_home }}", state: directory, owner: "{{ minecraft_user }}", group: "{{ minecraft_user }}", mode: "0700"}

- name: Framework checkout (pinned)
  ansible.builtin.git:
    repo: "{{ minecraft_repo }}"
    dest: "{{ minecraft_deploy_dir }}"
    version: "{{ minecraft_repo_version }}"
    force: false
  become_user: "{{ minecraft_user }}"
  vars: {ansible_become_flags: "-H -S"}
  register: mc_git

- name: Extra-plugin script
  ansible.builtin.copy:
    src: update-extra.sh
    dest: "{{ minecraft_deploy_dir }}/update-extra.sh"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0755"

- name: Plugins already downloaded?
  ansible.builtin.stat: {path: "{{ minecraft_deploy_dir }}/server/plugins/vane-core.jar"}
  register: plugins_present

- name: Pinned Paper and Velocity jars (PaperMC v3 API; v2 is sunset)
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ minecraft_deploy_dir }}
    fetch() {  # project version build dest
      meta=$(curl -fsS "https://fill.papermc.io/v3/projects/$1/versions/$2/builds/$3")
      url=$(echo "$meta" | jq -r '.downloads["server:default"].url')
      sha=$(echo "$meta" | jq -r '.downloads["server:default"].checksums.sha256')
      if [ -f "$4" ] && [ "$(sha256sum "$4" | cut -d' ' -f1)" = "$sha" ]; then return 0; fi
      curl -fsS -o "$4.tmp" "$url"
      [ "$(sha256sum "$4.tmp" | cut -d' ' -f1)" = "$sha" ] || { echo "checksum mismatch $4"; rm -f "$4.tmp"; exit 1; }
      mv "$4.tmp" "$4"; echo changed
    }
    fetch paper {{ minecraft_paper_version }} {{ minecraft_paper_build }} server/paper.jar
    fetch velocity {{ minecraft_velocity_version }} {{ minecraft_velocity_build }} proxy/velocity.jar
  args: {executable: /bin/bash}
  become_user: "{{ minecraft_user }}"
  vars: {ansible_become_flags: "-H -S"}
  register: mc_jars
  changed_when: "'changed' in mc_jars.stdout"

- name: Plugin downloads (upstream scripts minus the sunset-API jar calls)
  ansible.builtin.shell: |
    set -e
    for d in server proxy; do
      sed -E '/^download_(paper|velocity) /d' $d/update.sh > $d/update-plugins.sh
      chmod +x $d/update-plugins.sh
      ./$d/update-plugins.sh
    done
    ./update-extra.sh
  args: {chdir: "{{ minecraft_deploy_dir }}", executable: /bin/bash}
  become_user: "{{ minecraft_user }}"
  vars: {ansible_become_flags: "-H -S"}
  when: minecraft_force_update or not (plugins_present.stat.exists | default(false))
  changed_when: true

- name: Config directories
  ansible.builtin.file:
    path: "{{ minecraft_deploy_dir }}/{{ item }}"
    state: directory
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0755"
  loop: "{{ minecraft_config_files | map('dirname') | unique | sort | list }}"

- name: Config files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ minecraft_deploy_dir }}/{{ item }}"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"
  loop: "{{ minecraft_config_files }}"
  no_log: true          # templates contain secrets after rendering
  notify: Restart minecraft

- name: EULA
  ansible.builtin.copy:
    dest: "{{ minecraft_deploy_dir }}/server/eula.txt"
    content: "eula=true\n"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0644"

- name: Velocity forwarding secret
  ansible.builtin.copy:
    dest: "{{ minecraft_deploy_dir }}/proxy/forwarding.secret"
    content: "{{ minecraft_forwarding_secret }}"
    owner: "{{ minecraft_user }}"
    group: "{{ minecraft_user }}"
    mode: "0600"
  no_log: true
  notify: Restart minecraft

- name: systemd units (from the framework's contrib/)
  ansible.builtin.copy:
    src: "{{ minecraft_deploy_dir }}/contrib/systemd/{{ item }}"
    dest: "/usr/lib/systemd/system/{{ item }}"
    remote_src: true
    mode: "0644"
  loop: [minecraft-server.service, minecraft-proxy.service]
  notify: Reload systemd

- name: Drop-in directory
  ansible.builtin.file: {path: /etc/systemd/system/minecraft-server.service.d, state: directory, mode: "0755"}

- name: Drop-in allowing perf_event_open (spark profiler)
  ansible.builtin.copy:
    dest: /etc/systemd/system/minecraft-server.service.d/override.conf
    content: "[Service]\nSystemCallFilter=perf_event_open\n"
    mode: "0644"
  notify: Reload systemd

- ansible.builtin.meta: flush_handlers

- name: World present?
  ansible.builtin.stat: {path: "{{ minecraft_deploy_dir }}/server/world/level.dat"}
  register: mc_world

- name: Notice - empty server
  ansible.builtin.debug:
    msg: "No world on this host. Server will generate a NEW world. To bring back data run: ansible-playbook playbooks/minecraft.yml --tags restore -e minecraft_restore_archive=<file>"
  when: not mc_world.stat.exists

- name: Enable (and start) services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: "{{ 'started' if minecraft_start else omit }}"
  loop: [minecraft-proxy.service, minecraft-server.service]

- name: Wait for proxy port
  ansible.builtin.wait_for: {port: 25565, timeout: 180}
  when: minecraft_start
