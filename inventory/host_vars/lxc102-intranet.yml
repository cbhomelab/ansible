# monitoring_agents (t_07bcd212): NPM/openresty logs (world-readable).
monitoring_agents_promtail_jobs:
  - app: npm-access
    paths: ["/data/logs/*_access.log"]
  - app: npm-error
    paths: ["/data/logs/*_error.log"]
