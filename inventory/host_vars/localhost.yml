---
# Adopted (pre-existing) LXCs, declared to match their live config exactly.
# Values here must mirror reality; the role never destroys, and protection is the only intended change.
proxmox_guests_lxc:
  - {vmid: 104, hostname: glance, ostemplate: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst", cores: 1, memory: 512, swap: 512, disk: "local-lvm:4", features: ["nesting=1", "keyctl=1"], tags: [community-script, dashboard]}
  - {vmid: 102, hostname: intranet, ostemplate: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst", cores: 2, memory: 1024, swap: 512, disk: "local-lvm:16", features: ["nesting=1", "keyctl=1"], tun: true}
  - {vmid: 103, hostname: hermesagent, ostemplate: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst", cores: 4, memory: 6144, swap: 1024, disk: "local-lvm:20", features: ["nesting=1", "keyctl=1"], tags: [agent, ai, automation, community-script], protection: false}
  - {vmid: 108, hostname: pihole, ostemplate: "local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst", cores: 2, memory: 1024, swap: 512, disk: "local-lvm:12", features: ["nesting=1"], tun: true}
  - {vmid: 110, hostname: forgejo, ostemplate: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst", cores: 2, memory: 1024, swap: 512, disk: "local-lvm:16", ip: 10.20.0.50/24, gw: 10.20.0.1, nameserver: "10.20.0.8 10.20.0.56", features: ["nesting=1"], tags: [ansible, git], update: true}
  - {vmid: 111, hostname: mattermost, ostemplate: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst", cores: 2, memory: 2048, swap: 512, disk: "local-lvm:16", ip: 10.20.0.51/24, gw: 10.20.0.1, nameserver: "10.20.0.8 10.20.0.56", features: ["nesting=1"], tags: [ansible, chat, hermes], update: true}
  - {vmid: 106, hostname: iracing-prod, ostemplate: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst", cores: 4, memory: 4096, swap: 512, disk: "local-lvm:20", features: ["nesting=1"], ip: 10.20.0.162/24, gw: 10.20.0.1, nameserver: "10.20.0.8 10.20.0.56", tags: [ansible, iracing, prod]}

# Pre-existing VMs: not cloneable/creatable by the role (PCI/USB passthrough), so declared for drift reporting only.
proxmox_guests_adopted:
  - {vmid: 100, type: qemu, name: router, cores: 2, memory: 6144, onboot: true, agent: 1, update: true}
  - {vmid: 101, type: qemu, name: homeassistant, cores: 4, memory: 8192, onboot: true, agent: 1, update: true}

# Pre-existing VMs that only get protection=1.
proxmox_guests_protect_only:
  - {vmid: 100, type: qemu}
  - {vmid: 101, type: qemu}

# Injected into new guests at create time (hermes_proxmox public key; lets Ansible reach root).
proxmox_guests_ssh_pubkeys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHQtpJWpshP+DhNGHcjkafWcgCUorc9T72wJ1AAD6UnN hermes@proxmox-boundary"
