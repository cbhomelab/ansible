---
# Secrets for all hosts, sourced from Bitwarden via the community.general
# bitwarden lookup plugin. Requires `bw` CLI logged in/unlocked on the
# control node (or BW_SESSION exported) — see the Bitwarden integration
# task for control-node setup. Until that's done, these are placeholder
# item names: update them to match the real Bitwarden vault entries.
#
# GOTCHA (hit live 2026-11-12): community.general.bitwarden lookup always
# returns a LIST (one entry per matching item), even for a single-value
# field lookup. Interpolating the bare lookup() into a Jinja string yields
# Python's list repr ("['secret']"), not the secret itself - this silently
# produced a garbage Proxmox API token ("invalid token value" 401) before
# being caught. ALWAYS index [0] (or pipe | first) on every lookup here.

pve_user: "{{ lookup('community.general.bitwarden', 'homelab-proxmox-api', field='username')[0] }}"
pve_pass: "{{ lookup('community.general.bitwarden', 'homelab-proxmox-api', field='password')[0] }}"
pve_host: "10.20.0.6"

# Set true once christian's real SSH pubkey is supplied (user-provided, or
# a Bitwarden "homelab-ssh-christian" item created) and the fleet rollout
# has verified it. Until then, every access_control_users christian entry
# below resolves to an EMPTY ssh_authorized_keys list rather than calling
# the Bitwarden lookup — the lookup throws "item undefined" today, which
# would hard-fail every host's play. Flipping this on is a prerequisite
# for ever setting access_control_disable_password_auth: true anywhere,
# since disabling password auth before christian's key is verified would
# lock him out.
access_control_christian_key_ready: true

# webui_identity: unify WebUI/API logins to "christian" across every
# service with its own user DB. Runs once from localhost
# (playbooks/webui.yml), so these vars live here at the all.yml level
# rather than under a specific inventory group.
#
# EXECUTION ORDERING CONSTRAINT: do not run playbooks/webui.yml for real
# until (1) roles/access_control has created the christian/hermes OS
# users fleet-wide - the Proxmox entry below depends on christian@pam
# being a real, authenticatable system user - and (2) every Bitwarden
# item name referenced below exists with real values. Until then these
# are placeholder item names; the role code itself is safe to review/run
# in --check mode any time.
#
# Pi-hole deliberately has no entry here beyond the no-op note task - see
# roles/webui_identity/tasks/pihole.yml.
webui_identity_accounts:
  - service: proxmox
    username: christian
    api_base_url: "10.20.0.6"
    extra:
      token_id: "hermes@pve!hermes"
      token_secret: "{{ lookup('community.general.bitwarden', 'homelab-proxmox-api', field='password')[0] }}"

  - service: omv
    username: christian
    password: "{{ lookup('community.general.bitwarden', 'homelab-webui-christian-omv', field='password')[0] }}"
    api_base_url: "10.20.0.2"
    extra:
      admin_user: "{{ lookup('community.general.bitwarden', 'homelab-omv-api', field='username')[0] }}"
      admin_pass: "{{ lookup('community.general.bitwarden', 'homelab-omv-api', field='password')[0] }}"
      email: "christian@cbho.me"

  # RESOLVED 2026-11-13 (see kanban t_70dafa15): christian's UniFi admin
  # account was created manually via the UI (hermes's "homelab-unifi-admin"
  # account is still not super-admin, so unattended invite/create-admin
  # still 400s/errors - see roles/webui_identity/tasks/unifi.yml for why
  # this is a verify-only check rather than a create path). Uses
  # christian's own stored credential, not hermes's bootstrap creds.
  - service: unifi
    username: christian
    password: "{{ lookup('community.general.bitwarden', 'Unifi Controller', field='password')[0] }}"
    api_base_url: "10.20.0.19"

  - service: npm
    username: christian
    password: "{{ lookup('community.general.bitwarden', 'homelab-webui-christian-npm', field='password')[0] }}"
    api_base_url: "10.20.0.4:81"
    extra:
      admin_email: "{{ lookup('community.general.bitwarden', 'homelab-npm-admin', field='username')[0] }}"
      admin_pass: "{{ lookup('community.general.bitwarden', 'homelab-npm-admin', field='password')[0] }}"
      email: "christian@cbho.me"
      full_name: "Christian Bishop"

  - service: home_assistant
    username: christian
    api_base_url: "10.20.0.5"
    # no password/extra needed - this one is a documented manual step,
    # see roles/webui_identity/tasks/home_assistant.yml

  # DEFERRED (verified live 2026-11-12): this OPNsense install is 24.1.5_3,
  # which predates the Core\Api\UserController the opnsense.yml task
  # targets - POST /api/core/user/searchUser 400s with "controller ...
  # UserController not found" (confirmed via curl). On this version, local
  # user CRUD only exists at the legacy /system_usermanager.php form, not
  # the REST API. Re-enable this entry once OPNsense is upgraded past the
  # version that ships the User API controller (tracked alongside the
  # "OPNsense Config Review" firmware-update note - 60 pending updates as
  # of 2026-11-12). hermes's automation already goes through the API key
  # in ~/.config/opnsense/env (no interactive hermes login configured for
  # Ansible), so that part of this task is satisfied independent of this.
  # - service: opnsense
  #   username: christian
  #   password: "{{ lookup('community.general.bitwarden', 'homelab-webui-christian-opnsense', field='password')[0] }}"
  #   api_base_url: "10.10.0.1"
  #   extra:
  #     api_key: "{{ lookup('community.general.bitwarden', 'homelab-opnsense-api', field='username')[0] }}"
  #     api_secret: "{{ lookup('community.general.bitwarden', 'homelab-opnsense-api', field='password')[0] }}"
  #     full_name: "Christian Bishop"

  - service: pihole
    username: christian
    # no-op - single shared admin password, see tasks/pihole.yml

# Grafana: confirmed deployed as part of the 90-logging OMV compose stack
# (Loki+Promtail+Grafana), reachable at 10.20.0.161:3000 (mgmt_bridge
# static IP, plain HTTP, no host-port publish). Added 2026-11-12 once
# verified via `docker compose` on saturn.
  - service: grafana
    username: christian
    password: "{{ lookup('community.general.bitwarden', 'homelab-webui-christian-grafana', field='password')[0] }}"
    api_base_url: "10.20.0.161:3000"
    extra:
      admin_user: "{{ lookup('community.general.bitwarden', 'homelab-grafana-admin', field='username')[0] }}"
      admin_pass: "{{ lookup('community.general.bitwarden', 'homelab-grafana-admin', field='password')[0] }}"
      email: "christian@cbho.me"
      full_name: "Christian Bishop"

