---
# VM guests on neptune — same "proxmox" trust boundary as proxmox_host and
# lxc_guests, sharing the hermes_proxmox keypair.

access_control_users:
  - name: christian
    groups: [sudo]
    shell: /bin/bash
    ssh_authorized_keys: >-
      {{ [lookup('community.general.bitwarden', 'homelab-ssh-christian', field='notes')]
      if access_control_christian_key_ready else [] }}
  - name: hermes
    groups: [sudo]
    shell: /bin/bash
    # TODO(bitwarden-migration): see lxc_guests.yml note — same hermes_proxmox
    # boundary key, local value until t_eab3e60d unblocks.
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHQtpJWpshP+DhNGHcjkafWcgCUorc9T72wJ1AAD6UnN hermes@proxmox-boundary"

access_control_sudoers:
  - name: christian
    rule: "christian ALL=(ALL) NOPASSWD:ALL"
  - name: hermes
    rule: "hermes ALL=(ALL) NOPASSWD:ALL"
