---
# proxmox_host-specific vars.
# Same "proxmox" trust boundary as lxc_guests/vm_guests — shares the
# hermes_proxmox keypair (one key for the hypervisor + everything it hosts).

ansible_ssh_private_key_file: ~/.ssh/hermes_proxmox

access_control_users:
  - name: christian
    groups: [sudo]
    shell: /bin/bash
    # NOTE: see lxc_guests.yml — lookup() already returns a list natively,
    # don't re-wrap in [...] (t_94d8a27c).
    ssh_authorized_keys: >-
      {{ lookup('community.general.bitwarden', 'homelab-ssh-christian', field='notes')
      if access_control_christian_key_ready else [] }}
  - name: hermes
    groups: [sudo]
    shell: /bin/bash
    # TODO(bitwarden-migration): see group_vars/lxc_guests.yml note — same
    # hermes_proxmox boundary key, local value until t_eab3e60d unblocks.
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHQtpJWpshP+DhNGHcjkafWcgCUorc9T72wJ1AAD6UnN hermes@proxmox-boundary"

access_control_sudoers:
  - name: christian
    rule: "christian ALL=(ALL) NOPASSWD:ALL"
  - name: hermes
    rule: "hermes ALL=(ALL) NOPASSWD:ALL"

# Metrics (t_03920b33): neptune is NOT given any agent. It is scraped remotely by
# prometheus-pve-exporter on saturn (90-metrics) using Proxmox user
# prometheus@pve, token "exporter" (PVEAuditor at /, privsep). Secret is in
# Bitwarden (Homelab-Infra / proxmox-prometheus-exporter). See
# roles/monitoring_agents/README.md for rollback.
