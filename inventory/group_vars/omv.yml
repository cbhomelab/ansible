---
# OpenMediaVault-specific vars.
omv_api_user: "{{ lookup('community.general.bitwarden', 'homelab-omv-api', field='username') }}"
omv_api_pass: "{{ lookup('community.general.bitwarden', 'homelab-omv-api', field='password') }}"

# "saturn" trust boundary — its own dedicated hermes keypair, separate from
# the proxmox-guest boundary.
ansible_ssh_private_key_file: ~/.ssh/hermes_saturn

access_control_users:
  - name: christian
    groups: [sudo]
    shell: /bin/bash
    # NOTE: see lxc_guests.yml — lookup() already returns a list natively,
    # don't re-wrap in [...] (t_94d8a27c).
    ssh_authorized_keys: >-
      {{ lookup('community.general.bitwarden', 'homelab-ssh-christian', field='notes')
      if access_control_christian_key_ready else [] }}
  - name: hermes
    groups: [sudo]
    shell: /bin/bash
    # TODO(bitwarden-migration): once t_eab3e60d (Bitwarden backend) is
    # unblocked, move this to a lookup and drop the plain value here.
    # Private key lives ONLY on the Hermes host at ~/.ssh/hermes_saturn.
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKER3dq4Vbt22t1aHUEXzDdZJ/yTTNX3PIxP5Ua72G3z hermes@saturn-boundary"

access_control_sudoers:
  - name: christian
    rule: "christian ALL=(ALL) NOPASSWD:ALL"
  - name: hermes
    rule: "hermes ALL=(ALL) NOPASSWD:ALL"

# compose_stacks: opt-in projects kept running by the role. Compose files come
# from cbhomelab/docker-compose (deployed through OMV's compose plugin).
# VPN layout (Proton, WireGuard via gluetun):
#   20-qbittorrent  gluetun_qbit (US, port forwarding) + qbittorrent in its netns
#   (20-qbittorrent also runs `autoheal`; qbittorrent/sabnzbd carry an outbound-curl healthcheck + label autoheal=true,
#    so they restart themselves when their gluetun netns goes stale after a gluetun restart)
#   20-sabnzbd      gluetun_sab (US) + sabnzbd in its netns
#   20-vpn-arr      gluetun_arr (US) shared by prowlarr/sonarr/radarr/lidarr/bazarr/flaresolverr (10.20.0.149)
#   40-dispatcharr  gluetun_dispatcharr (US) at 10.40.0.17 + dispatcharr in its netns
#   Each tunnel has its own Proton key: global.env PROTON_WG_KEY_<ARR|QBIT|SAB|DISPATCHARR|LA|CO|AU>, from Bitwarden account.protonvpn.com custom fields
#   20-vpn-la/co/au gluetun + SOCKS5 + Tailscale exit node: Los Angeles / Denver / Stockholm
compose_stacks_projects:
  - {name: 20-qbittorrent, state: started}
  - {name: 20-sabnzbd, state: started}
  - {name: 20-vpn-arr, state: started}
  # apps living in the VPN containers' network namespaces; listed after their gluetun so they start in order
  - {name: 20-prowlarr, state: started}
  - {name: 20-sonarr, state: started}
  - {name: 20-radarr, state: started}
  - {name: 20-lidarr, state: started}
  - {name: 20-bazarr, state: started}
  - {name: 40-dispatcharr, state: started}   # gluetun_dispatcharr (US) + dispatcharr; xml_proxy/epgo/tunarr outside the VPN
  - {name: 20-vpn-la, state: started}
  - {name: 20-vpn-co, state: started}
  - {name: 20-vpn-au, state: started}
  - {name: 40-mumble, state: started}   # Mumble voice server on EXT 10.40.0.26 (secrets in appdata/mumble-secrets.env, untracked)
compose_stacks_required_global_vars:
  - PROTON_WG_KEY_ARR
  - PROTON_WG_KEY_QBIT
  - PROTON_WG_KEY_SAB
  - PROTON_WG_KEY_DISPATCHARR
  - PROTON_WG_KEY_LA
  - PROTON_WG_KEY_CO
  - PROTON_WG_KEY_AU
compose_stacks_global_env_bitwarden:
  PROTON_WG_PRIVATE_KEY: "Proton VPN WireGuard key (gluetun, saturn)"   # legacy shared key, no longer referenced
  PROTON_WG_KEY_ARR: {item: account.protonvpn.com, field: arr}
  PROTON_WG_KEY_QBIT: {item: account.protonvpn.com, field: qbit}
  PROTON_WG_KEY_SAB: {item: account.protonvpn.com, field: sab}
  PROTON_WG_KEY_DISPATCHARR: {item: account.protonvpn.com, field: dispatcharr}
  PROTON_WG_KEY_LA: {item: account.protonvpn.com, field: la}
  PROTON_WG_KEY_CO: {item: account.protonvpn.com, field: co}
  PROTON_WG_KEY_AU: {item: account.protonvpn.com, field: au}

# system_baseline: opt-in; OMV manages its own updates, so only
# packages + timezone-name-compatible bits, no unattended-upgrades/journald.
system_baseline_enabled: true
system_baseline_unattended_upgrades: false
system_baseline_journald_enabled: false
system_baseline_timezone_enabled: false

backup_enabled: true

compose_stacks_enabled: true

monitoring_agents_node_exporter_textfile_dir: /var/lib/node_exporter/textfile

backup_metrics_enabled: true
backup_alertmanager_enabled: true
backup_alertmanager_pushover_enabled: true
