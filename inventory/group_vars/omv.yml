---
# OpenMediaVault-specific vars.
omv_api_user: "{{ lookup('community.general.bitwarden', 'homelab-omv-api', field='username') }}"
omv_api_pass: "{{ lookup('community.general.bitwarden', 'homelab-omv-api', field='password') }}"

# "saturn" trust boundary — its own dedicated hermes keypair, separate from
# the proxmox-guest boundary.
ansible_ssh_private_key_file: ~/.ssh/hermes_saturn

access_control_users:
  - name: christian
    groups: [sudo]
    shell: /bin/bash
    # NOTE: see lxc_guests.yml — lookup() already returns a list natively,
    # don't re-wrap in [...] (t_94d8a27c).
    ssh_authorized_keys: >-
      {{ lookup('community.general.bitwarden', 'homelab-ssh-christian', field='notes')
      if access_control_christian_key_ready else [] }}
  - name: hermes
    groups: [sudo]
    shell: /bin/bash
    # TODO(bitwarden-migration): once t_eab3e60d (Bitwarden backend) is
    # unblocked, move this to a lookup and drop the plain value here.
    # Private key lives ONLY on the Hermes host at ~/.ssh/hermes_saturn.
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKER3dq4Vbt22t1aHUEXzDdZJ/yTTNX3PIxP5Ua72G3z hermes@saturn-boundary"

access_control_sudoers:
  - name: christian
    rule: "christian ALL=(ALL) NOPASSWD:ALL"
  - name: hermes
    rule: "hermes ALL=(ALL) NOPASSWD:ALL"

# compose_stacks placeholder (scaffolded, not implemented — see
# roles/compose_stacks/README.md). Real project list to be enumerated
# from saturn:/opt/docker-compose/ when implemented.
# compose_stacks_projects: []

# system_baseline: opt-in; OMV manages its own updates, so only
# packages + timezone-name-compatible bits, no unattended-upgrades/journald.
system_baseline_enabled: true
system_baseline_unattended_upgrades: false
system_baseline_journald_enabled: false
system_baseline_timezone_enabled: false
