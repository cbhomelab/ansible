---
# Homelab inventory.
#
# Groups:
#   proxmox_host  - the Proxmox VE hypervisor itself
#   lxc_guests    - LXC containers on neptune managed over SSH/Ansible
#   vm_guests     - KVM virtual machines on neptune managed over SSH/Ansible
#   omv           - OpenMediaVault NAS
#   windows       - Windows hosts managed over SSH (OpenSSH Server, not WinRM)
#   appliances    - devices managed purely via their own HTTP/API, not
#                   generic SSH/Ansible targets (OPNsense, UniFi controller).
#                   These are documented here for inventory completeness but
#                   carry ansible_connection: local — real automation against
#                   them goes through their REST APIs, not ansible modules
#                   that assume a shell.
all:
  children:
    proxmox_host:
      hosts:
        neptune:
          ansible_host: 10.20.0.6
          description: Proxmox VE node hosting all other guests

    lxc_guests:
      hosts:
        lxc102-intranet:
          ansible_host: 10.20.0.102
          vmid: 102
          description: Intranet / Nginx Proxy Manager
        lxc103-hermesagent:
          ansible_host: 10.20.0.103
          vmid: 103
          description: Hermes agent control node (this box) — handle with care
        lxc104-glance:
          ansible_host: 10.20.0.104
          vmid: 104
          description: Glance dashboard
        lxc105-minecraft:
          ansible_host: 10.20.0.105
          vmid: 105
          description: Minecraft server (currently stopped)
        lxc108-pihole:
          ansible_host: 10.20.0.108
          vmid: 108
          description: Pi-hole DNS

    vm_guests:
      hosts:
        vm101-homeassistant:
          ansible_host: 10.20.0.5
          vmid: 101
          description: Home Assistant OS VM

    omv:
      hosts:
        saturn:
          ansible_host: 10.20.0.2
          description: OpenMediaVault NAS — docker-compose media/automation stack

    windows:
      hosts:
        cb-gaming:
          ansible_host: 10.10.0.17
          ansible_user: christian
          description: Windows gaming PC, reachable via OpenSSH Server (SSH alias windows-christian)

    appliances:
      vars:
        ansible_connection: local
      hosts:
        vm100-opnsense:
          ansible_host: 10.20.0.1
          vmid: 100
          description: OPNsense router VM — API-managed only, no generic SSH/Ansible access
        lxc107-unifi:
          ansible_host: 10.20.0.107
          vmid: 107
          description: UniFi network controller — API-managed only, no generic SSH/Ansible access
