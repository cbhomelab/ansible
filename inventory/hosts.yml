---
# Homelab inventory.
#
# Groups:
#   proxmox_host  - the Proxmox VE hypervisor itself
#   lxc_guests    - LXC containers on neptune managed over SSH/Ansible
#   vm_guests     - KVM virtual machines on neptune managed over SSH/Ansible
#   omv           - OpenMediaVault NAS
#   windows       - Windows hosts managed over SSH (OpenSSH Server, not WinRM)
#   appliances    - devices managed purely via their own HTTP/API, not
#                   generic SSH/Ansible targets (OPNsense, UniFi controller).
#                   These are documented here for inventory completeness but
#                   carry ansible_connection: local — real automation against
#                   them goes through their REST APIs, not ansible modules
#                   that assume a shell.
all:
  children:
    proxmox_host:
      hosts:
        neptune:
          ansible_host: 10.20.0.6
          description: Proxmox VE node hosting all other guests

    lxc_guests:
      hosts:
        # IP-DRIFT FIX (t_022a83c7, Nov 2026): ansible_host below now reflects
        # the ACTUAL live IP (verified via `pct exec <vmid> -- ip addr` on
        # neptune), not the vmid-pattern IP originally assumed. The
        # vmid-pattern IP that was WRONG is kept in `assumed_ip_drifted_from`
        # purely for audit trail. `mac` + `dhcp_reservation: true` marks hosts
        # that get an OPNsense Kea DHCP static reservation from
        # roles/network_appliances pinning them to this same (now-canonical)
        # IP so they stop drifting. Hosts whose IP is pinned at the Proxmox
        # guest-config level instead (static `ip=` in LXC net0, not DHCP)
        # carry `dhcp_reservation: false` — OPNsense's DHCP server never sees
        # a request from them, so a DHCP reservation would be a no-op; see
        # roles/network_appliances/README.md "Pilot findings" table.
        lxc102-intranet:
          ansible_host: 10.20.0.4
          assumed_ip_drifted_from: 10.20.0.102
          vmid: 102
          mac: "BC:24:11:9B:B0:D6"
          dhcp_reservation: true
          description: Intranet / Nginx Proxy Manager
        lxc103-hermesagent:
          ansible_host: 10.20.0.21
          assumed_ip_drifted_from: 10.20.0.103
          vmid: 103
          mac: "BC:24:11:92:A6:E7"
          dhcp_reservation: true
          description: Hermes agent control node (this box) — handle with care
        lxc104-glance:
          ansible_host: 10.20.0.202
          assumed_ip_drifted_from: 10.20.0.104
          vmid: 104
          mac: "BC:24:11:1C:08:0C"
          dhcp_reservation: true
          description: Glance dashboard
        lxc105-minecraft:
          ansible_host: 10.20.0.130
          assumed_ip_drifted_from: 10.20.0.105
          vmid: 105
          mac: "BC:24:11:34:0B:50"
          # t_8e1e2f09 (2026-11-13): migration to DHCP was ATTEMPTED and then
          # REVERTED same day. A prior (rate-limited, interrupted) attempt at
          # this task flipped net0 to ip=dhcp before the Kea reservation was
          # live on the serving backend — OPNsense is still mid-migration
          # from ISC dhcpd to Kea (Kea disabled, ISC is the live DHCP server;
          # see t_a2d2e368), so the container picked up an unreserved address
          # (10.20.0.204) from ISC's dynamic pool instead of .130. Found and
          # fixed in this pass: net0 reverted to static ip=10.20.0.130/24,
          # stale dhclient process killed, stray secondary address removed,
          # resolv.conf restored to nameserver 10.20.0.8 (pihole). Verified
          # back to normal (static .130, DNS working, port 25565 reachable).
          # dhcp_reservation stays false until AFTER the ISC->Kea cutover
          # (t_a2d2e368) actually lands on the LAN interface — do not retry
          # this migration before then.
          dhcp_reservation: false
          description: Minecraft server
          # Running (not stopped) as of 2026-11-13 — confirmed via `pct status 105`.
        lxc108-pihole:
          ansible_host: 10.20.0.8
          assumed_ip_drifted_from: 10.20.0.108
          vmid: 108
          mac: "46:AD:CE:61:2E:58"
          # t_8e1e2f09 (2026-11-13), per user correction: pihole stays STATIC
          # at the Proxmox level (it serves DNS — it must not move off a
          # fixed IP). dhcp_reservation: true here is NOT a migration; it
          # only reserves 10.20.0.8 to this host's real MAC in Kea so the
          # dynamic pool can never hand this address to a different device.
          # lxc108 itself never performs a DHCP handshake (static ip= in its
          # Proxmox net0), so the reservation has zero effect on lxc108 —
          # it exists purely as a collision guard for everyone else.
          dhcp_reservation: true
          description: Pi-hole DNS

    vm_guests:
      hosts:
        vm101-homeassistant:
          ansible_host: 10.20.0.5
          vmid: 101
          mac: "02:B6:3D:E7:BC:34"
          dhcp_reservation: true  # already correct; reservation just pins it
          description: Home Assistant OS VM

    omv:
      hosts:
        saturn:
          ansible_host: 10.20.0.2
          description: OpenMediaVault NAS — docker-compose media/automation stack

    windows:
      hosts:
        cb-gaming:
          ansible_host: 10.10.0.17
          ansible_user: christian
          description: Windows gaming PC, reachable via OpenSSH Server (SSH alias windows-christian)

    appliances:
      vars:
        ansible_connection: local
      hosts:
        vm100-opnsense:
          ansible_host: 10.20.0.1
          vmid: 100
          description: OPNsense router VM — API-managed only, no generic SSH/Ansible access
        lxc107-unifi:
          ansible_host: 10.20.0.19
          vmid: 107
          description: >-
            UniFi network controller — API-managed for the webui_identity
            domain (hence membership here), but it's a real Debian LXC with
            a normal OS-level SSH/sudo surface underneath the controller
            app, so access_control targets it over SSH too. See
            host_vars/lxc107-unifi.yml, which overrides ansible_connection
            back to ssh and supplies the proxmox trust-boundary access vars,
            and playbooks/access.yml, which adds this host explicitly.
